name: Container Structure Analyzer
description: Analyzes container structure, checks nesy_factory availability, and maps accessible libraries
inputs:
  - name: dummy_input
    type: String
    description: Dummy input for analysis
outputs:
  - name: container_structure
    type: String
    description: Container filesystem and package structure
  - name: nesy_analysis
    type: String
    description: Detailed analysis of nesy_factory
  - name: import_guide
    type: String
    description: Guide on how to import/use found modules
  - name: missing_deps
    type: String
    description: Missing dependencies report
implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v36-gpu
    command:
      - sh
      - -c
      - |
        echo "========================================================="
        echo "CONTAINER STRUCTURE ANALYZER"
        echo "========================================================="
        echo ""
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import os
        import sys
        import json
        import importlib
        import subprocess
        import argparse
        from pathlib import Path
        
        print('\\n' + '='*80)
        print('CONTAINER STRUCTURE ANALYZER')
        print('='*80)
        
        parser = argparse.ArgumentParser(description='Container Structure Analyzer')
        parser.add_argument('--dummy_input', type=str, required=True)
        parser.add_argument('--container_structure', type=str, required=True)
        parser.add_argument('--nesy_analysis', type=str, required=True)
        parser.add_argument('--import_guide', type=str, required=True)
        parser.add_argument('--missing_deps', type=str, required=True)
        args = parser.parse_args()
        
        print(f'Starting analysis with input: {args.dummy_input}')
        
        # ==================================================
        # 1. SYSTEM PATH ANALYSIS
        # ==================================================
        print('\\n' + '='*80)
        print('SYSTEM PATH ANALYSIS')
        print('='*80)
        
        path_info = {
            'python_path': sys.path,
            'system_path': os.environ.get('PATH', '').split(':'),
            'python_executable': sys.executable,
            'python_version': sys.version,
            'current_directory': os.getcwd()
        }
        
        print(f'Python path: {sys.path[:5]}...')
        print(f'System PATH: {os.environ.get("PATH", "")[:100]}...')
        print(f'Python executable: {sys.executable}')
        
        # ==================================================
        # 2. PACKAGE LOCATION SEARCH
        # ==================================================
        print('\\n' + '='*80)
        print('PACKAGE LOCATION SEARCH')
        print('='*80)
        
        def find_package_location(package_name):
            try:
                spec = importlib.util.find_spec(package_name)
                if spec and spec.origin:
                    return os.path.dirname(spec.origin)
                return None
            except:
                return None
        
        # Check for nesy_factory
        nesy_path = None
        nesy_found = False
        nesy_info = {}
        
        # Common locations to check
        search_locations = [
            '/usr/local/lib/python3.10/site-packages',
            '/usr/local/lib/python3.9/site-packages', 
            '/usr/local/lib/python3.8/site-packages',
            '/usr/lib/python3.10/site-packages',
            '/usr/lib/python3.9/site-packages',
            '/opt/conda/lib/python3.10/site-packages',
            '/opt/conda/lib/python3.9/site-packages',
            '/venv/lib/python3.10/site-packages',
            '/venv/lib/python3.9/site-packages',
            '/app',
            '/root',
            '.'
        ]
        
        print('Searching for nesy_factory...')
        for location in search_locations:
            nesy_test_path = os.path.join(location, 'nesy_factory')
            if os.path.exists(nesy_test_path):
                nesy_path = nesy_test_path
                nesy_found = True
                print(f'✓ Found at: {nesy_path}')
                break
        
        if not nesy_found:
            print('✗ nesy_factory not found in standard locations')
            # Try pip show
            try:
                result = subprocess.run(
                    ['pip', 'show', '-f', 'nesy_factory'],
                    capture_output=True, text=True, timeout=5
                )
                if result.returncode == 0:
                    lines = result.stdout.split('\\n')
                    for line in lines:
                        if line.startswith('Location:'):
                            nesy_path = line.split(':', 1)[1].strip()
                            nesy_found = True
                            print(f'✓ Found via pip: {nesy_path}')
                            break
            except:
                pass
        
        # ==================================================
        # 3. NESY_FACTORY STRUCTURE ANALYSIS
        # ==================================================
        print('\\n' + '='*80)
        print('NESY_FACTORY STRUCTURE ANALYSIS')
        print('='*80)
        
        nesy_analysis = {
            'found': nesy_found,
            'path': nesy_path,
            'structure': {},
            'modules': {},
            'importable': False,
            'import_errors': []
        }
        
        if nesy_found and nesy_path:
            # Add to Python path for import testing
            if nesy_path not in sys.path:
                sys.path.insert(0, nesy_path)
                print(f'Added to Python path: {nesy_path}')
            
            # Analyze directory structure
            try:
                for root, dirs, files in os.walk(nesy_path):
                    rel_root = os.path.relpath(root, nesy_path)
                    if rel_root == '.':
                        rel_root = ''
                    
                    # Skip __pycache__ and other hidden directories
                    dirs[:] = [d for d in dirs if not d.startswith('.') and d != '__pycache__']
                    
                    # Get Python files
                    py_files = [f for f in files if f.endswith('.py')]
                    if py_files:
                        nesy_analysis['structure'][rel_root if rel_root else 'root'] = py_files
            
            except Exception as e:
                nesy_analysis['import_errors'].append(f'Directory walk error: {e}')
            
            # Check for key directories
            key_dirs = ['GANs', 'CNNs', 'models', 'utils', 'data', 'configs']
            for dir_name in key_dirs:
                dir_path = os.path.join(nesy_path, dir_name)
                nesy_analysis['modules'][dir_name] = os.path.exists(dir_path)
                status = '✓' if os.path.exists(dir_path) else '✗'
                print(f'{status} {dir_name}/')
            
            # Specifically check GANs directory
            gans_path = os.path.join(nesy_path, 'GANs')
            if os.path.exists(gans_path):
                print('\\nGANs module contents:')
                try:
                    gan_files = [f for f in os.listdir(gans_path) if f.endswith('.py')]
                    for f in gan_files:
                        print(f'  - {f}')
                    nesy_analysis['modules']['GANs_files'] = gan_files
                except:
                    print('  Could not list GANs files')
            
            # ==================================================
            # 4. IMPORT TESTING
            # ==================================================
            print('\\n' + '='*80)
            print('IMPORT TESTING')
            print('='*80)
            
            # Test basic import
            try:
                import nesy_factory
                nesy_analysis['importable'] = True
                print('✓ import nesy_factory: SUCCESS')
            except Exception as e:
                nesy_analysis['importable'] = False
                nesy_analysis['import_errors'].append(f'nesy_factory import: {e}')
                print(f'✗ import nesy_factory: FAILED - {e}')
            
            # Test GANs import
            if os.path.exists(gans_path):
                try:
                    from nesy_factory.GANs import __init__ as gans_init
                    print('✓ from nesy_factory.GANs import *: SUCCESS')
                    nesy_analysis['modules']['GANs_importable'] = True
                    
                    # Check what's exported
                    if hasattr(gans_init, '__all__'):
                        print(f'  Available exports: {gans_init.__all__}')
                        nesy_analysis['modules']['GANs_exports'] = gans_init.__all__
                    
                except Exception as e:
                    nesy_analysis['modules']['GANs_importable'] = False
                    nesy_analysis['import_errors'].append(f'GANs import: {e}')
                    print(f'✗ GANs import: FAILED - {e}')
                
                # Try to import specific GAN modules
                gan_modules_to_test = ['dcgan', 'vanilla_gan']
                for module_name in gan_modules_to_test:
                    module_path = os.path.join(gans_path, f'{module_name}.py')
                    if os.path.exists(module_path):
                        try:
                            # Try direct exec to see what's in the file
                            with open(module_path, 'r') as f:
                                content = f.read()
                                # Look for class definitions
                                classes = []
                                for line in content.split('\\n'):
                                    if line.strip().startswith('class '):
                                        class_name = line.split('class ')[1].split('(')[0].strip()
                                        classes.append(class_name)
                                if classes:
                                    print(f'  ✓ {module_name}.py contains: {classes[:3]}...')
                                    nesy_analysis['modules'][f'{module_name}_classes'] = classes[:5]
                        except:
                            pass
        
        # ==================================================
        # 5. ALTERNATIVE ACCESS METHODS
        # ==================================================
        print('\\n' + '='*80)
        print('ALTERNATIVE ACCESS METHODS')
        print('='*80)
        
        access_methods = []
        
        # Method 1: Direct file reading
        if nesy_found:
            access_methods.append({
                'method': 'Direct file reading',
                'description': 'Read and exec Python files directly',
                'example': '''
                # Read and execute a module
                with open("/path/to/nesy_factory/GANs/dcgan.py", "r") as f:
                    code = f.read()
                exec(code, globals())
                # Now DCGAN class is available
                ''',
                'pros': 'No import needed, works even with broken imports',
                'cons': 'Less safe, manual dependency management'
            })
        
        # Method 2: Dynamic import
        access_methods.append({
            'method': 'Dynamic import',
            'description': 'Use importlib to import modules',
            'example': '''
                import importlib.util
                import sys
                
                # Add nesy_factory to path
                sys.path.insert(0, "/path/to/nesy_factory")
                
                # Import module
                spec = importlib.util.spec_from_file_location(
                    "dcgan", 
                    "/path/to/nesy_factory/GANs/dcgan.py"
                )
                module = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(module)
                # Now use module.DCGAN
            ''',
            'pros': 'More control over imports',
            'cons': 'More verbose'
        })
        
        # Method 3: Copy and use locally
        access_methods.append({
            'method': 'Copy and modify',
            'description': 'Copy needed files to local directory and fix imports',
            'example': '''
                import shutil
                import os
                
                # Copy GANs directory
                shutil.copytree("/path/to/nesy_factory/GANs", "./local_gans")
                
                # Modify imports in copied files
                # Replace "from nesy_factory." with local imports
                # Then import normally
            ''',
            'pros': 'Full control, can fix broken dependencies',
            'cons': 'Requires file modification'
        })
        
        # ==================================================
        # 6. CREATE IMPORT GUIDE
        # ==================================================
        print('\\n' + '='*80)
        print('CREATING IMPORT GUIDE')
        print('='*80)
        
        import_guide = {
            'summary': f'nesy_factory found: {nesy_found}',
            'location': nesy_path,
            'recommended_methods': [],
            'code_examples': {}
        }
        
        if nesy_found:
            # Guide for using found nesy_factory
            import_guide['recommended_methods'].append('Add to sys.path and import')
            import_guide['code_examples']['basic_import'] = f'''
            # Add to Python path
            import sys
            sys.path.insert(0, "{nesy_path}")
            
            # Try importing
            try:
                import nesy_factory
                print("Successfully imported nesy_factory")
            except Exception as e:
                print(f"Import failed: {{e}}")
            
            # Try importing GANs
            try:
                from nesy_factory.GANs import *
                print("GANs imported successfully")
                # Check what's available
                print(f"Available: {{__all__ if '__all__' in locals() else 'Unknown'}}")
            except Exception as e:
                print(f"GANs import failed: {{e}}")
            '''
            
            # If GANs directory exists
            gans_dir = os.path.join(nesy_path, 'GANs') if nesy_path else None
            if gans_dir and os.path.exists(gans_dir):
                import_guide['recommended_methods'].append('Direct GANs module access')
                import_guide['code_examples']['gans_direct'] = f'''
                # Method 1: Direct file execution
                import sys
                sys.path.insert(0, "{os.path.dirname(gans_dir)}")
                
                # Execute dcgan.py directly
                with open("{os.path.join(gans_dir, 'dcgan.py')}", "r") as f:
                    dcgan_code = f.read()
                
                # Execute in a namespace
                namespace = {{}}
                exec(dcgan_code, namespace)
                
                # Now you can access DCGAN class
                if 'DCGAN' in namespace:
                    print("DCGAN class available")
                    DCGAN = namespace['DCGAN']
                '''
                
                # Check for specific classes in files
                for gan_file in ['dcgan.py', 'vanilla_gan.py']:
                    file_path = os.path.join(gans_dir, gan_file)
                    if os.path.exists(file_path):
                        try:
                            with open(file_path, 'r') as f:
                                content = f.read()
                                # Look for class definitions
                                classes_found = []
                                for line in content.split('\\n'):
                                    if line.strip().startswith('class '):
                                        class_name = line.split('class ')[1].split('(')[0].strip()
                                        classes_found.append(class_name)
                                
                                if classes_found:
                                    import_guide['code_examples'][f'{gan_file}_classes'] = {
                                        'file': gan_file,
                                        'classes': classes_found,
                                        'import_example': f'''
                                        # To use classes from {gan_file}
                                        with open("{file_path}", "r") as f:
                                            code = f.read()
                                        exec(code)
                                        # Now {classes_found[0]} is available
                                        '''
                                    }
                        except:
                            pass
        
        else:
            # Guide for missing nesy_factory
            import_guide['recommended_methods'].append('Install missing package')
            import_guide['code_examples']['install'] = '''
            # Option 1: Install via pip (if available in PyPI)
            # pip install nesy_factory
            
            # Option 2: Clone and install from source
            # git clone https://github.com/username/nesy_factory.git
            # cd nesy_factory
            # pip install -e .
            
            # Option 3: Copy from another container
            # docker cp <container_id>:/usr/local/lib/python3.10/site-packages/nesy_factory ./nesy_factory
            '''
            
            import_guide['recommended_methods'].append('Use alternative implementations')
            import_guide['code_examples']['alternative'] = '''
            # If nesy_factory is not available, you can:
            # 1. Use standard PyTorch GAN implementations
            # 2. Copy the GAN code you need into your project
            # 3. Use a different container that has nesy_factory
            '''
        
        # ==================================================
        # 7. CHECK DEPENDENCIES
        # ==================================================
        print('\\n' + '='*80)
        print('DEPENDENCY CHECK')
        print('='*80)
        
        dependencies = {
            'torch': None,
            'torchvision': None,
            'numpy': None,
            'PIL': None,
            'scipy': None
        }
        
        missing_deps = []
        
        for dep in dependencies.keys():
            try:
                module = __import__(dep)
                dependencies[dep] = {
                    'version': getattr(module, '__version__', 'unknown'),
                    'available': True
                }
                print(f'✓ {dep}: {dependencies[dep]["version"]}')
            except ImportError as e:
                dependencies[dep] = {
                    'available': False,
                    'error': str(e)
                }
                missing_deps.append(dep)
                print(f'✗ {dep}: MISSING')
        
        # ==================================================
        # 8. SAVE RESULTS
        # ==================================================
        print('\\n' + '='*80)
        print('SAVING ANALYSIS RESULTS')
        print('='*80)
        
        # Create output directory structure
        os.makedirs(os.path.dirname(args.container_structure), exist_ok=True)
        os.makedirs(os.path.dirname(args.nesy_analysis), exist_ok=True)
        os.makedirs(os.path.dirname(args.import_guide), exist_ok=True)
        os.makedirs(os.path.dirname(args.missing_deps), exist_ok=True)
        
        # Save container structure
        with open(args.container_structure, 'w') as f:
            json.dump({
                'python_info': path_info,
                'nesy_factory_found': nesy_found,
                'nesy_path': nesy_path,
                'dependencies': dependencies
            }, f, indent=2)
        print(f'✓ Container structure saved to: {args.container_structure}')
        
        # Save nesy analysis
        with open(args.nesy_analysis, 'w') as f:
            json.dump(nesy_analysis, f, indent=2)
        print(f'✓ nesy_factory analysis saved to: {args.nesy_analysis}')
        
        # Save import guide
        with open(args.import_guide, 'w') as f:
            json.dump(import_guide, f, indent=2)
        print(f'✓ Import guide saved to: {args.import_guide}')
        
        # Save missing dependencies
        with open(args.missing_deps, 'w') as f:
            json.dump({
                'missing': missing_deps,
                'dependencies': dependencies,
                'recommendations': [
                    f'Install missing: pip install {" ".join(missing_deps)}' if missing_deps else 'All dependencies available'
                ]
            }, f, indent=2)
        print(f'✓ Missing dependencies saved to: {args.missing_deps}')
        
        # ==================================================
        # 9. PRINT SUMMARY
        # ==================================================
        print('\\n' + '='*80)
        print('ANALYSIS SUMMARY')
        print('='*80)
        print(f'nesy_factory found: {nesy_found}')
        print(f'Location: {nesy_path or "Not found"}')
        print(f'Importable: {nesy_analysis.get("importable", False)}')
        print(f'GANs directory: {os.path.exists(os.path.join(nesy_path, "GANs")) if nesy_path else False}')
        print(f'Missing dependencies: {missing_deps}')
        
        if nesy_found:
            print('\\nRECOMMENDED APPROACH:')
            print('1. Add nesy_factory to Python path:')
            print(f'   sys.path.insert(0, "{nesy_path}")')
            print('2. Try importing:')
            print('   from nesy_factory.GANs import *')
            print('3. Or use direct file execution for specific modules')
        else:
            print('\\nRECOMMENDED APPROACH:')
            print('1. Install nesy_factory package')
            print('2. Use a different container with nesy_factory')
            print('3. Copy GAN implementation files manually')
        
        print('\\nAnalysis complete!')
        
    args:
      - --dummy_input
      - {inputValue: dummy_input}
      - --container_structure
      - /tmp/container_structure.json
      - --nesy_analysis
      - /tmp/nesy_analysis.json
      - --import_guide
      - /tmp/import_guide.json
      - --missing_deps
      - /tmp/missing_deps.json
