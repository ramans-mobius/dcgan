name: gpu Build
description: Builds GAN model using master config, validates architecture, and auto-corrects if needed
inputs:
  - name: gan_config_json
    type: String
    description: Master GAN configuration as JSON string
  - name: model_name
    type: String
    description: Model name (dcgan or vanilla_gan)
outputs:
  - name: model_out
    type: Model
  - name: gan_config_base64_updated
    type: String
    description: Updated master GAN configuration (base64 encoded)
  - name: model_info
    type: String

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v36gpu
    command:
      - sh
      - -c
      - |
        echo "========================================================="
        echo "STARTING GAN MODEL BUILDER - DEPENDENCY INSTALLATION"
        echo "========================================================="
        pip install torchvision==0.15.2 --quiet
        echo "Torchvision installation completed"
        echo "========================================================="
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import sys
        import json
        import pickle
        import base64
        import traceback
        import time
        import math
        
        print("\\n" + "="*80)
        print("GAN MODEL BUILDER STARTING")
        print("="*80)
        
        parser = argparse.ArgumentParser(description='GAN Model Builder')
        parser.add_argument('--gan_config_json', type=str, required=True, help='Master GAN config as JSON string')
        parser.add_argument('--model_name', type=str, required=True, help='Model name (dcgan or vanilla_gan)')
        parser.add_argument('--model_out', type=str, required=True, help='Output path for model')
        parser.add_argument('--gan_config_base64_updated', type=str, required=True, help='Output path for updated config (base64)')
        parser.add_argument('--model_info', type=str, required=True, help='Output path for model info')
        args = parser.parse_args()
        
        print(f"ARGUMENTS RECEIVED:")
        print(f"  model_name: {args.model_name}")
        print(f"  gan_config_json length: {len(args.gan_config_json)} characters")
        
        # Parse JSON config
        print("\\n" + "="*80)
        print("PARSING MASTER GAN CONFIGURATION")
        print("="*80)
        
        try:
            gan_config = json.loads(args.gan_config_json)
            print("✓ Master GAN config parsed successfully")
            
            # Get configuration
            dataset_config = gan_config.get('dataset', {})
            model_config = gan_config.get('model', {})
            training_config = gan_config.get('training', {})
            
            image_size = dataset_config.get('image_size', 64)
            channels = dataset_config.get('channels', 1)
            latent_dim = model_config.get('latent_dim', 100)
            
            print(f"Image size: {image_size}")
            print(f"Channels: {channels}")
            print(f"Latent dim: {latent_dim}")
            
            # Get layers from config or calculate them
            generator_layers = model_config.get('generator_layers', [])
            discriminator_layers = model_config.get('discriminator_layers', [])
            
            print(f"\\nUsing layers from config:")
            print(f"  Generator layers: {generator_layers}")
            print(f"  Discriminator layers: {discriminator_layers}")
                
        except Exception as e:
            print(f"✗ Failed to parse JSON config: {e}")
            traceback.print_exc()
            sys.exit(1)
        
        # Override model type if specified
        print("\\n" + "="*80)
        print("MODEL TYPE SELECTION")
        print("="*80)
        
        if args.model_name.lower() in ['dcgan', 'vanilla_gan']:
            model_config['gan_type'] = args.model_name.lower()
            print(f"Using model name from argument: {args.model_name.lower()}")
        
        model_type = model_config.get('gan_type', 'dcgan')
        print(f"\\n✓ Building {model_type.upper()} model")
        
        # Import torch
        print("\\n" + "="*80)
        print("PYTORCH INITIALIZATION")
        print("="*80)
        
        try:
            import torch
            import torch.nn as nn
            print(f"PyTorch version: {torch.__version__}")
            print(f"CUDA available: {torch.cuda.is_available()}")
        except ImportError as e:
            print(f"✗ Failed to import torch: {e}")
            sys.exit(1)
        
        # Architecture calculation function
        def calculate_dcgan_architecture(image_size, channels):
            print(f"Calculating architecture for {image_size}x{image_size} images...")
            
            # Generator: Start from 4x4, double until we reach target
            generator_layers = []
            current_channels = 512
            current_size = 4
            
            print(f"Generator progression: {current_size}x{current_size} -> ", end="")
            while current_size < image_size:
                generator_layers.append(current_channels)
                current_size *= 2
                current_channels //= 2
                print(f"{current_size}x{current_size} -> ", end="")
            
            # Add output layer
            generator_layers.append(channels)
            print(f"final (channels={channels})")
            
            # Discriminator: Start from image_size, halve until 4x4
            discriminator_layers = []
            current_channels = 64
            current_size = image_size
            
            print(f"Discriminator progression: {current_size}x{current_size} -> ", end="")
            while current_size > 4:
                discriminator_layers.append(current_channels)
                current_size //= 2
                current_channels *= 2
                print(f"{current_size}x{current_size} -> ", end="")
            
            # Add final layer for real/fake classification
            discriminator_layers.append(1)
            print(f"final (1 channel)")
            
            return generator_layers, discriminator_layers
        
        # Calculate what layers SHOULD be for the target image size
        expected_gen_layers, expected_disc_layers = calculate_dcgan_architecture(image_size, channels)
        
        print(f"\\nExpected architecture for {image_size}x{image_size}:")
        print(f"  Generator layers: {expected_gen_layers}")
        print(f"  Discriminator layers: {expected_disc_layers}")
        
        # Function to validate generator output size
        def validate_generator_output(generator_layers, image_size, channels):
            # DCGAN starts from 4x4 and doubles for each layer (except output)
            start_size = 4
            output_size = start_size
            for i in range(len(generator_layers) - 1):  # Exclude output layer
                output_size *= 2
            return output_size
        
        # Check if current layers will produce correct output
        if model_type == 'dcgan' and generator_layers:
            calculated_size = validate_generator_output(generator_layers, image_size, channels)
            print(f"\\n--- VALIDATING ARCHITECTURE ---")
            print(f"Config generator layers: {generator_layers}")
            print(f"Will produce: {calculated_size}x{calculated_size} output")
            print(f"Expected: {image_size}x{image_size} output")
            
            if calculated_size != image_size:
                print(f" ARCHITECTURE MISMATCH DETECTED!")
                print(f"  Current layers produce {calculated_size}x{calculated_size}")
                print(f"  But dataset expects {image_size}x{image_size}")
                
                # Auto-correct the layers
                print(f"\\n--- AUTO-CORRECTING ARCHITECTURE ---")
                print(f"Updating generator layers: {generator_layers} -> {expected_gen_layers}")
                print(f"Updating discriminator layers: {discriminator_layers} -> {expected_disc_layers}")
                
                # Update the config with corrected layers
                generator_layers = expected_gen_layers
                discriminator_layers = expected_disc_layers
                
                # Update master config
                gan_config['model']['generator_layers'] = generator_layers
                gan_config['model']['discriminator_layers'] = discriminator_layers
                gan_config['model']['architecture_corrected'] = True
                gan_config['model']['original_generator_layers'] = model_config.get('generator_layers', [])
                gan_config['model']['original_discriminator_layers'] = model_config.get('discriminator_layers', [])
                gan_config['model']['correction_reason'] = f"Generator produced {calculated_size}x{calculated_size}, expected {image_size}x{image_size}"
                
                print(f"✓ Configuration auto-corrected!")
            else:
                print(f"✓ Architecture is correct for {image_size}x{image_size} output")
                gan_config['model']['architecture_valid'] = True
        
        # Load the GAN module
        print("\\n" + "="*80)
        print(f"LOADING {model_type.upper()} MODULE")
        print("="*80)
        
        try:
            if model_type == 'dcgan':
                print("Loading DCGAN...")
                
                dcgan_path = "/usr/local/lib/python3.10/site-packages/nesy_factory/GANs/dcgan.py"
                
                with open(dcgan_path, 'r') as f:
                    dcgan_code = f.read()
                
                local_namespace = {}
                exec(dcgan_code, local_namespace)
                
                DCGAN = local_namespace['DCGAN']
                DCGANConfig = local_namespace['DCGANConfig']
                print("✓ Successfully loaded DCGAN classes")
                
                # Create DCGAN config with AUTO-CORRECTED layers
                print("\\n--- BUILDING DCGAN CONFIGURATION (with corrected layers) ---")
                print(f"  Image size: {image_size}")
                print(f"  Channels: {channels}")
                print(f"  Latent dim: {latent_dim}")
                print(f"  Generator layers: {generator_layers}")
                print(f"  Discriminator layers: {discriminator_layers}")
                
                dcgan_config_dict = {
                    'image_size': image_size,
                    'channels': channels,
                    'latent_dim': latent_dim,
                    'generator_layers': generator_layers,
                    'discriminator_layers': discriminator_layers,
                    'training_algorithm': model_config.get('training_algorithm', 'backprop'),
                    'batch_size': training_config.get('batch_size', 32),
                    'learning_rate': model_config.get('learning_rate', 0.0002),
                    'epochs': training_config.get('epochs', 50),
                    'device': 'cuda' if torch.cuda.is_available() else 'cpu',
                    'generator_features': 64,
                    'discriminator_features': 64,
                    'generator_activation': 'relu',
                    'generator_output_activation': 'tanh',
                    'generator_norm': 'batch_norm',
                    'discriminator_activation': 'leaky_relu',
                    'discriminator_output_activation': 'sigmoid',
                    'discriminator_norm': 'batch_norm',
                    'optimizer_type': 'adam',
                    'beta1': 0.5,
                    'beta2': 0.999,
                }
                
                try:
                    dcgan_config = DCGANConfig(**dcgan_config_dict)
                    print("✓ DCGANConfig created successfully")
                except Exception as e:
                    print(f"✗ Failed to create DCGANConfig: {e}")
                    print("Creating minimal DCGANConfig...")
                    minimal_config = {
                        'image_size': image_size,
                        'channels': channels,
                        'latent_dim': latent_dim,
                        'generator_layers': generator_layers,
                        'discriminator_layers': discriminator_layers,
                        'device': 'cpu'
                    }
                    dcgan_config = DCGANConfig(**minimal_config)
                
                print("\\nInstantiating DCGAN model...")
                model = DCGAN(dcgan_config)
                print("✓ DCGAN model instantiated")
                
                # Test and validate generator output
                print("\\n--- VALIDATING GENERATOR OUTPUT ---")
                print(f"Expected output: (batch, {channels}, {image_size}, {image_size})")
                
                with torch.no_grad():
                    test_noise = torch.randn(2, latent_dim, 1, 1)
                    sample_output = model.generator(test_noise)
                    actual_shape = tuple(sample_output.shape)
                    print(f"Actual output: {actual_shape}")
                    
                    expected_shape = (2, channels, image_size, image_size)
                    
                    if actual_shape == expected_shape:
                        print("✓ Generator output matches expected shape!")
                        gan_config['model']['generator_output_validated'] = True
                    else:
                        print(f"✗ GENERATOR OUTPUT MISMATCH!")
                        print(f"   Expected: {expected_shape}")
                        print(f"   Got: {actual_shape}")
                        gan_config['model']['generator_output_validated'] = False
                
                if hasattr(model, 'discriminator'):
                    with torch.no_grad():
                        d_output = model.discriminator(sample_output)
                        print(f"Discriminator output shape: {d_output.shape}")
                        
                        # Validate discriminator can accept generator output
                        try:
                            # Also test with real image shape
                            real_test = torch.randn(2, channels, image_size, image_size)
                            d_real_output = model.discriminator(real_test)
                            print(f"Discriminator real test output shape: {d_real_output.shape}")
                            print("✓ Discriminator can process both generator output and real images")
                            gan_config['model']['discriminator_input_validated'] = True
                        except Exception as e:
                            print(f"✗ Discriminator input validation failed: {e}")
                            gan_config['model']['discriminator_input_validated'] = False
                
            elif model_type == 'vanilla_gan':
                print("\\nLoading VanillaGAN...")
                
                vanilla_path = "/usr/local/lib/python3.10/site-packages/nesy_factory/GANs/vanilla_gan.py"
                
                with open(vanilla_path, 'r') as f:
                    vanilla_code = f.read()
                
                local_namespace = {}
                exec(vanilla_code, local_namespace)
                
                VanillaGAN = local_namespace['VanillaGAN']
                VanillaGANConfig = local_namespace['VanillaGANConfig']
                print("✓ Successfully loaded VanillaGAN classes")
                
                # Create VanillaGAN config
                input_dim = image_size * image_size * channels
                
                vanilla_config_dict = {
                    'input_dim': input_dim,
                    'latent_dim': latent_dim,
                    'generator_layers': generator_layers,
                    'discriminator_layers': discriminator_layers,
                    'training_algorithm': model_config.get('training_algorithm', 'backprop'),
                    'batch_size': training_config.get('batch_size', 64),
                    'lr': model_config.get('learning_rate', 0.0002),
                    'epochs': training_config.get('epochs', 50),
                    'device': 'cuda' if torch.cuda.is_available() else 'cpu',
                }
                
                try:
                    vanilla_config = VanillaGANConfig(**vanilla_config_dict)
                    print("✓ VanillaGANConfig created successfully")
                except Exception as e:
                    print(f"✗ Failed to create VanillaGANConfig: {e}")
                    minimal_config = {
                        'input_dim': input_dim,
                        'latent_dim': latent_dim,
                        'generator_layers': generator_layers,
                        'discriminator_layers': discriminator_layers,
                        'device': 'cpu'
                    }
                    vanilla_config = VanillaGANConfig(**minimal_config)
                
                print("\\nInstantiating VanillaGAN model...")
                model = VanillaGAN(vanilla_config)
                print("✓ VanillaGAN model instantiated")
                
                # Test VanillaGAN
                print("\\n--- VALIDATING VANILLAGAN ---")
                with torch.no_grad():
                    test_noise = torch.randn(2, latent_dim)
                    sample_output = model.generator(test_noise)
                    print(f"Generator output shape: {sample_output.shape}")
                    print(f"Expected flattened size: {input_dim}")
                    
                    if sample_output.shape[1] == input_dim:
                        print("✓ Generator output matches expected size!")
                        gan_config['model']['generator_output_validated'] = True
                    else:
                        print(f"✗ Generator output mismatch!")
                        gan_config['model']['generator_output_validated'] = False
                
                if hasattr(model, 'discriminator'):
                    with torch.no_grad():
                        d_output = model.discriminator(sample_output)
                        print(f"Discriminator output shape: {d_output.shape}")
                        gan_config['model']['discriminator_input_validated'] = True
                
            else:
                print(f"✗ Unknown model type: {model_type}")
                sys.exit(1)
                
        except Exception as e:
            print(f"✗ Failed to create model: {e}")
            traceback.print_exc()
            sys.exit(1)
        
        if model is None:
            print("✗ Model creation failed")
            sys.exit(1)
        
        # Update master config with the ACTUAL layers used
        print("\\n" + "="*80)
        print("UPDATING MASTER CONFIGURATION")
        print("="*80)
        
        gan_config['model'].update({
            'model_built': True,
            'model_class': type(model).__name__,
            'latent_dim': latent_dim,
            'built_timestamp': time.strftime('%Y-%m-%dT%H:%M:%SZ'),
            'actual_channels': channels,
            'actual_image_size': image_size,
            'generator_layers_used': generator_layers,
            'discriminator_layers_used': discriminator_layers,
            'build_device': 'cuda' if torch.cuda.is_available() else 'cpu',
            'generator_output_size': sample_output.shape if 'sample_output' in locals() else None,
            'discriminator_input_size': (channels, image_size, image_size) if model_type == 'dcgan' else input_dim,
        })
        
        # Ensure the config has the layers for Train brick to use
        gan_config['model']['generator_layers'] = generator_layers
        gan_config['model']['discriminator_layers'] = discriminator_layers
        
        # Create model info
        model_info_data = {
            'model_type': model_type,
            'model_name': args.model_name,
            'build_status': 'success',
            'model_class': type(model).__name__,
            'latent_dim': latent_dim,
            'channels': channels,
            'image_size': image_size,
            'generator_layers': generator_layers,
            'discriminator_layers': discriminator_layers,
            'generator_parameters': sum(p.numel() for p in model.generator.parameters()) if hasattr(model, 'generator') else 0,
            'discriminator_parameters': sum(p.numel() for p in model.discriminator.parameters()) if hasattr(model, 'discriminator') else 0,
            'pytorch_version': torch.__version__,
            'cuda_available': torch.cuda.is_available(),
            'build_timestamp': time.strftime('%Y-%m-%dT%H:%M:%SZ'),
            'architecture_validated': gan_config['model'].get('generator_output_validated', False),
            'architecture_corrected': gan_config['model'].get('architecture_corrected', False),
            'original_layers_used': gan_config['model'].get('original_generator_layers') is not None,
        }
        
        # Save model state
        print("\\n" + "="*80)
        print("SAVING OUTPUTS")
        print("="*80)
        
        os.makedirs(os.path.dirname(args.model_out) or '.', exist_ok=True)
        
        model_state = {
            'model_type': model_type,
            'config': dcgan_config_dict if model_type == 'dcgan' else vanilla_config_dict,
            'generator_state': model.generator.state_dict() if hasattr(model, 'generator') else None,
            'discriminator_state': model.discriminator.state_dict() if hasattr(model, 'discriminator') else None,
            'model_class': type(model).__name__,
            'generator_layers': generator_layers,
            'discriminator_layers': discriminator_layers,
            'image_size': image_size,
            'channels': channels,
            'latent_dim': latent_dim,
            'architecture_corrected': gan_config['model'].get('architecture_corrected', False),
        }
        
        with open(args.model_out, 'wb') as f:
            pickle.dump(model_state, f, protocol=pickle.HIGHEST_PROTOCOL)
        print(f"✓ Model state saved to: {args.model_out}")
        
        # Save updated config (with auto-corrected layers if needed)
        updated_config_json = json.dumps(gan_config, indent=2)
        updated_config_base64 = base64.b64encode(updated_config_json.encode('utf-8')).decode('utf-8')
        
        os.makedirs(os.path.dirname(args.gan_config_base64_updated) or '.', exist_ok=True)
        with open(args.gan_config_base64_updated, 'w') as f:
            f.write(updated_config_base64)
        print(f"✓ Updated config saved to: {args.gan_config_base64_updated}")
        
        os.makedirs(os.path.dirname(args.model_info) or '.', exist_ok=True)
        with open(args.model_info, 'w') as f:
            json.dump(model_info_data, f, indent=2)
        print(f"✓ Model info saved to: {args.model_info}")
        
        print("\\n" + "="*80)
        print("BUILD PROCESS COMPLETED SUCCESSFULLY")
        print("="*80)
        print(f"Model type: {model_type}")
        print(f"Image size: {image_size}x{image_size}")
        print(f"Channels: {channels}")
        print(f"Generator layers used: {generator_layers}")
        print(f"Discriminator layers used: {discriminator_layers}")
        
        if gan_config['model'].get('architecture_corrected', False):
            print(f"\\n ARCHITECTURE WAS AUTO-CORRECTED")
            print(f"  Original generator layers: {gan_config['model'].get('original_generator_layers', [])}")
            print(f"  Original discriminator layers: {gan_config['model'].get('original_discriminator_layers', [])}")
            print(f"  Reason: {gan_config['model'].get('correction_reason', 'N/A')}")
        
        print(f"\\nNEXT: Train brick will use the corrected architecture from this config")

    args:
      - --gan_config_json
      - {inputValue: gan_config_json}
      - --model_name
      - {inputValue: model_name}
      - --model_out
      - {outputPath: model_out}
      - --gan_config_base64_updated
      - {outputPath: gan_config_base64_updated}
      - --model_info
      - {outputPath: model_info}
