name: Model Building
description: Instantiates either DCGAN or VanillaGAN model using nesy_factory.GANs modules
inputs:
  - name: config_str
    type: String    
  - name: model_name
    type: String
outputs:
  - name: model_out
    type: Model
  - name: config_updated
    type: String
  - name: model_info_out
    type: String

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v34
    command:
      - sh
      - -c
      - |
        pip install torchvision==0.15.2 --quiet
        exec python3 -u -c "
        import sys
        import os
        import json
        import pickle
        import traceback

        print('GAN MODEL BUILDER')
        print('='*60)

        config_str = sys.argv[1]
        model_name = sys.argv[2]
        model_out_path = sys.argv[3]
        config_updated_path = sys.argv[4]
        model_info_out_path = sys.argv[5]

        print('Building model: ' + model_name)

        try:
            config = json.loads(config_str)
            print('Config parsed successfully')
        except Exception as e:
            print('Failed to parse config: ' + str(e))
            sys.exit(1)

        model_config = config.get('model', {})
        model_type = model_name.lower()
        if model_type not in ['dcgan', 'vanilla_gan']:
            print('Unknown model type: ' + model_type + ', defaulting to dcgan')
            model_type = 'dcgan'

        print('Model type: ' + model_type.upper())

        model_config['model_type'] = model_type
        config['model'] = model_config
        config['model_type'] = model_type

        try:
            import torch
            print('PyTorch version: ' + torch.__version__)
            print('CUDA available: ' + str(torch.cuda.is_available()))
        except Exception as e:
            print('Failed to import torch: ' + str(e))
            sys.exit(1)

        model = None

        try:
            print('Importing nesy_factory.GANs modules')

            if model_type == 'dcgan':
                try:
                    from nesy_factory.GANs.dcgan import DCGAN, DCGANConfig
                    print('Successfully imported DCGAN modules')

                    # Build DCGAN config based on your pipeline script
                    dcgan_config_dict = {
                        'image_size': model_config.get('image_size', 64),
                        'channels': model_config.get('channels', 3),
                        'latent_dim': model_config.get('latent_dim', 100),
                        'training_algorithm': model_config.get('training_algorithm', 'backprop'),
                        'batch_size': model_config.get('batch_size', 32),
                        'learning_rate': model_config.get('learning_rate', 0.0002),
                        'epochs': model_config.get('epochs', 50),
                        'device': 'cuda' if torch.cuda.is_available() else 'cpu',
                        'use_wgan': model_config.get('use_wgan', False),
                        'generator_features': model_config.get('generator_features', 64),
                        'discriminator_features': model_config.get('discriminator_features', 64),
                        'n_critic': model_config.get('n_critic', 1),
                    }

                    # Add algorithm-specific parameters
                    algorithm = model_config.get('training_algorithm', 'backprop')
                    if algorithm == 'forward_forward':
                        dcgan_config_dict.update({
                            'use_forward_forward': True,
                            'ff_blocks': model_config.get('ff_blocks', 2),
                            'ff_epochs_per_block': model_config.get('ff_epochs_per_block', 3),
                            'ff_theta': model_config.get('ff_theta', 1.0),
                            'ff_goodness_fn': 'mean_squares',
                        })
                    elif algorithm == 'cafo':
                        dcgan_config_dict.update({
                            'use_cafo': True,
                            'cafo_blocks': model_config.get('cafo_blocks', 2),
                            'epochs_per_block': model_config.get('epochs_per_block', 3),
                            'block_lr': model_config.get('block_lr', 0.001),
                        })

                    print('Creating DCGAN with config: ' + str(dcgan_config_dict))
                    dcgan_config = DCGANConfig(**dcgan_config_dict)
                    model = DCGAN(dcgan_config)
                    print('DCGAN created successfully')

                except Exception as e:
                    print('DCGAN import failed: ' + str(e))
                    traceback.print_exc()

            elif model_type == 'vanilla_gan':
                try:
                    from nesy_factory.GANs.vanilla_gan import VanillaGAN, VanillaGANConfig
                    print('Successfully imported VanillaGAN modules')

                    # Build VanillaGAN config based on your pipeline script
                    vanilla_config_dict = {
                        'input_dim': model_config.get('input_dim', 784),
                        'latent_dim': model_config.get('latent_dim', 100),
                        'training_algorithm': model_config.get('training_algorithm', 'backprop'),
                        'generator_layers': model_config.get('generator_layers', [256, 512, 1024]),
                        'discriminator_layers': model_config.get('discriminator_layers', [1024, 512, 256]),
                        'batch_size': model_config.get('batch_size', 64),
                        'lr': model_config.get('learning_rate', 0.0002),
                        'epochs': model_config.get('epochs', 50),
                        'device': 'cuda' if torch.cuda.is_available() else 'cpu',
                    }

                    # Add algorithm-specific parameters
                    algorithm = model_config.get('training_algorithm', 'backprop')
                    if algorithm == 'forward_forward':
                        vanilla_config_dict.update({
                            'use_forward_forward': True,
                            'ff_blocks': model_config.get('ff_blocks', 3),
                            'ff_epochs_per_block': model_config.get('ff_epochs_per_block', 100),
                            'ff_theta': model_config.get('ff_theta', 2.0),
                        })
                    elif algorithm == 'cafo':
                        vanilla_config_dict.update({
                            'use_cafo': True,
                            'cafo_blocks': model_config.get('cafo_blocks', 3),
                            'epochs_per_block': model_config.get('epochs_per_block', 50),
                            'block_lr': model_config.get('block_lr', 0.001),
                        })

                    print('Creating VanillaGAN with config: ' + str(vanilla_config_dict))
                    vanilla_config = VanillaGANConfig(**vanilla_config_dict)
                    model = VanillaGAN(vanilla_config)
                    print('VanillaGAN created successfully')

                except Exception as e:
                    print('VanillaGAN import failed: ' + str(e))
                    traceback.print_exc()

        except Exception as e:
            print('Failed to import nesy_factory.GANs: ' + str(e))
            traceback.print_exc()

        if model is None:
            print('Model creation failed')
            sys.exit(1)

        print('Testing model')
        try:
            if model_type == 'dcgan':
                z = torch.randn(2, model_config.get('latent_dim', 100), 1, 1)
            else:
                z = torch.randn(2, model_config.get('latent_dim', 100))

            if hasattr(model, 'generator'):
                samples = model.generator(z)
                print('Generator test passed: Output shape = ' + str(samples.shape))
            else:
                print('No generator found in model')

        except Exception as e:
            print('Model test failed: ' + str(e))

        model_info = {}
        try:
            if hasattr(model, 'get_model_info'):
                model_info = model.get_model_info()
            elif hasattr(model, 'generator') and hasattr(model, 'discriminator'):
                gen_params = sum(p.numel() for p in model.generator.parameters())
                disc_params = sum(p.numel() for p in model.discriminator.parameters())
                model_info = {
                    'model_type': model_type,
                    'generator_parameters': gen_params,
                    'discriminator_parameters': disc_params,
                    'total_parameters': gen_params + disc_params,
                    'has_generator': True,
                    'has_discriminator': True
                }
            else:
                model_info = {'model_type': model_type, 'note': 'Limited info available'}
        except Exception as e:
            print('Could not get model info: ' + str(e))
            model_info = {'model_type': model_type, 'error': str(e)}

        combined_info = {
            **model_info,
            **config,
            'model_name': model_type
        }

        os.makedirs(os.path.dirname(model_out_path) or '.', exist_ok=True)
        os.makedirs(os.path.dirname(config_updated_path) or '.', exist_ok=True)
        os.makedirs(os.path.dirname(model_info_out_path) or '.', exist_ok=True)

        with open(model_out_path, 'wb') as f:
            pickle.dump(model, f)

        with open(config_updated_path, 'w') as f:
            json.dump(config, f, indent=2)

        with open(model_info_out_path, 'w') as f:
            json.dump(combined_info, f, indent=2)

        print('Model saved to: ' + model_out_path)
        print('Updated config saved to: ' + config_updated_path)
        print('Model info saved to: ' + model_info_out_path)
        print('GANBuildModel completed successfully')
        " "$1" "$2" "$3" "$4" "$5"
    args:
      - {inputValue: config_str}
      - {inputValue: model_name}
      - {outputPath: model_out}
      - {outputPath: config_updated}
      - {outputPath: model_info_out}
