name: 2 Model Building
description: Instantiates either DCGAN or VanillaGAN model using nesy_factory.GANs modules
inputs:
  - name: config_str
    type: String
    description: Model configuration as JSON string
  - name: model_name
    type: String
    description: GAN model architecture name (dcgan or vanilla_gan)
outputs:
  - name: model_out
    type: Model
  - name: config_updated
    type: String
  - name: model_info_out
    type: String

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v34
    command:
      - sh
      - -c
      - |
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import json
        import pickle
        import traceback
        import torch
        
        parser = argparse.ArgumentParser(description='GAN Model Builder')
        parser.add_argument('--config_str', type=str, required=True, help='JSON configuration string')
        parser.add_argument('--model_name', type=str, required=True, help='Model name (dcgan or vanilla_gan)')
        parser.add_argument('--model_out', type=str, required=True, help='Output path for model')
        parser.add_argument('--config_updated', type=str, required=True, help='Output path for updated config')
        parser.add_argument('--model_info_out', type=str, required=True, help='Output path for model info')
        args = parser.parse_args()
        
        print("GAN MODEL BUILDER STARTING")
        print("Input Arguments:")
        print(f"  model_name: {args.model_name}")
        print(f"  config_str length: {len(args.config_str)}")
        print(f"  model_out: {args.model_out}")
        print(f"  config_updated: {args.config_updated}")
        print(f"  model_info_out: {args.model_info_out}")
        
        try:
            config = json.loads(args.config_str)
            print("Config parsed successfully")
        except json.JSONDecodeError as e:
            print(f"Failed to parse config as JSON: {e}")
            print(f"config_str content (first 500 chars): {args.config_str[:500]}")
            if os.path.exists(args.config_str):
                print(f"config_str appears to be a file path, trying to read from file")
                try:
                    with open(args.config_str, 'r') as f:
                        config = json.load(f)
                    print(f"Config loaded from file: {args.config_str}")
                except Exception as e2:
                    print(f"Failed to load from file: {e2}")
                    config = {}
            else:
                config = {}
        except Exception as e:
            print(f"Unexpected error parsing config: {e}")
            traceback.print_exc()
            config = {}
        
        model_config = config.get('model', {})
        model_type = args.model_name.lower()
        
        if model_type not in ['dcgan', 'vanilla_gan']:
            print(f"Unknown model type: {model_type}, defaulting to dcgan")
            model_type = 'dcgan'
        
        print(f"Building {model_type.upper()} model")
        print(f"Model config keys: {list(model_config.keys())}")
        
        model = None
        
        try:
            if model_type == 'dcgan':
                from nesy_factory.GANs.dcgan import DCGAN, DCGANConfig
                
                dcgan_config_dict = {
                    'image_size': model_config.get('image_size', 64),
                    'channels': model_config.get('channels', 3),
                    'latent_dim': model_config.get('latent_dim', 100),
                    'training_algorithm': model_config.get('training_algorithm', 'backprop'),
                    'batch_size': model_config.get('batch_size', 32),
                    'learning_rate': model_config.get('learning_rate', 0.0002),
                    'epochs': model_config.get('epochs', 50),
                    'device': 'cuda' if torch.cuda.is_available() else 'cpu',
                    'use_wgan': model_config.get('use_wgan', False),
                    'generator_features': model_config.get('generator_features', 64),
                    'discriminator_features': model_config.get('discriminator_features', 64),
                }
                
                algorithm = model_config.get('training_algorithm', 'backprop')
                if algorithm == 'forward_forward':
                    dcgan_config_dict.update({
                        'use_forward_forward': True,
                        'ff_blocks': model_config.get('ff_blocks', 2),
                        'ff_epochs_per_block': model_config.get('ff_epochs_per_block', 3),
                    })
                elif algorithm == 'cafo':
                    dcgan_config_dict.update({
                        'use_cafo': True,
                        'cafo_blocks': model_config.get('cafo_blocks', 2),
                        'epochs_per_block': model_config.get('epochs_per_block', 3),
                    })
                
                print(f"Creating DCGAN with config: {dcgan_config_dict}")
                dcgan_config = DCGANConfig(**dcgan_config_dict)
                model = DCGAN(dcgan_config)
                print("DCGAN created successfully")
                
            elif model_type == 'vanilla_gan':
                from nesy_factory.GANs.vanilla_gan import VanillaGAN, VanillaGANConfig
                
                vanilla_config_dict = {
                    'input_dim': model_config.get('input_dim', 784),
                    'latent_dim': model_config.get('latent_dim', 100),
                    'training_algorithm': model_config.get('training_algorithm', 'backprop'),
                    'generator_layers': model_config.get('generator_layers', [256, 512, 1024]),
                    'discriminator_layers': model_config.get('discriminator_layers', [1024, 512, 256]),
                    'batch_size': model_config.get('batch_size', 64),
                    'lr': model_config.get('learning_rate', 0.0002),
                    'epochs': model_config.get('epochs', 50),
                    'device': 'cuda' if torch.cuda.is_available() else 'cpu',
                }
                
                algorithm = model_config.get('training_algorithm', 'backprop')
                if algorithm == 'forward_forward':
                    vanilla_config_dict.update({
                        'use_forward_forward': True,
                        'ff_blocks': model_config.get('ff_blocks', 3),
                        'ff_epochs_per_block': model_config.get('ff_epochs_per_block', 100),
                    })
                elif algorithm == 'cafo':
                    vanilla_config_dict.update({
                        'use_cafo': True,
                        'cafo_blocks': model_config.get('cafo_blocks', 3),
                        'epochs_per_block': model_config.get('epochs_per_block', 50),
                    })
                
                print(f"Creating VanillaGAN with config: {vanilla_config_dict}")
                vanilla_config = VanillaGANConfig(**vanilla_config_dict)
                model = VanillaGAN(vanilla_config)
                print("VanillaGAN created successfully")
                
        except ImportError as e:
            print(f"Failed to import nesy_factory.GANs: {e}")
            traceback.print_exc()
            sys.exit(1)
        except Exception as e:
            print(f"Failed to create model: {e}")
            traceback.print_exc()
            sys.exit(1)
        
        if model is None:
            print("Model creation failed")
            sys.exit(1)
        
        print("Testing model with random input")
        try:
            if model_type == 'dcgan':
                z = torch.randn(2, model_config.get('latent_dim', 100), 1, 1)
            else:
                z = torch.randn(2, model_config.get('latent_dim', 100))
            
            if hasattr(model, 'generator'):
                with torch.no_grad():
                    samples = model.generator(z)
                print(f"Generator test passed. Output shape: {samples.shape}")
            else:
                print("No generator found in model")
        except Exception as e:
            print(f"Model test failed: {e}")
        
        model_info = {}
        try:
            if hasattr(model, 'generator') and hasattr(model, 'discriminator'):
                gen_params = sum(p.numel() for p in model.generator.parameters())
                disc_params = sum(p.numel() for p in model.discriminator.parameters())
                model_info = {
                    'model_type': model_type,
                    'generator_parameters': gen_params,
                    'discriminator_parameters': disc_params,
                    'total_parameters': gen_params + disc_params,
                }
            else:
                model_info = {'model_type': model_type}
        except Exception as e:
            print(f"Could not get model info: {e}")
            model_info = {'model_type': model_type}
        
        config['model'] = model_config
        config['model_type'] = model_type
        
        combined_info = {
            **model_info,
            **config,
            'model_name': model_type
        }
        
        os.makedirs(os.path.dirname(args.model_out) or '.', exist_ok=True)
        os.makedirs(os.path.dirname(args.config_updated) or '.', exist_ok=True)
        os.makedirs(os.path.dirname(args.model_info_out) or '.', exist_ok=True)
        
        with open(args.model_out, 'wb') as f:
            pickle.dump(model, f)
        
        with open(args.config_updated, 'w') as f:
            json.dump(config, f, indent=2)
        
        with open(args.model_info_out, 'w') as f:
            json.dump(combined_info, f, indent=2)
        
        print("GANBuildModel completed successfully")
        print(f"Model saved to: {args.model_out}")
        print(f"Updated config saved to: {args.config_updated}")
        print(f"Model info saved to: {args.model_info_out}")

    args:
      - --model_name
      - {inputValue: model_name}
      - --config_str
      - {inputValue: config_str}
      - --model_out
      - {outputPath: model_out}
      - --config_updated
      - {outputPath: config_updated}
      - --model_info_out
      - {outputPath: model_info_out}
