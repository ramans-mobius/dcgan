name: Build Model
description: Instantiates either DCGAN or VanillaGAN model using nesy_factory.GANs modules
inputs:
  - name: config_str
    type: String
    description: Model configuration as JSON string (should have 'model' key)
  - name: model_name
    type: String
    description: GAN model architecture name (dcgan or vanilla_gan)
outputs:
  - name: model_out
    type: Model
  - name: config_updated
    type: String
  - name: model_info_out
    type: String

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v34
    command:
      - sh
      - -c
      - |
        # Install torchvision
        pip install torchvision==0.15.2 --quiet
        echo "Torchvision installed"
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import json
        import pickle
        import traceback
        import sys
        
        parser = argparse.ArgumentParser(description='GAN Model Builder')
        parser.add_argument('--config_str', type=str, required=True, help='JSON configuration string')
        parser.add_argument('--model_name', type=str, required=True, help='Model name (dcgan or vanilla_gan)')
        parser.add_argument('--model_out', type=str, required=True, help='Output path for model')
        parser.add_argument('--config_updated', type=str, required=True, help='Output path for updated config')
        parser.add_argument('--model_info_out', type=str, required=True, help='Output path for model info')
        args = parser.parse_args()
        
        print("GAN MODEL BUILDER STARTING")
        print("="*60)
        print(f"Input Arguments:")
        print(f"  model_name: {args.model_name}")
        print(f"  config_str length: {len(args.config_str)}")
        print(f"  config_str preview: {args.config_str[:100]}...")
        
        # Parse configuration
        try:
            config = json.loads(args.config_str)
            print("Configuration parsed successfully")
        except json.JSONDecodeError as e:
            print(f"Failed to parse config as JSON: {e}")
            print(f"Config content: {args.config_str[:200]}")
            sys.exit(1)
        
        # Ensure config has 'model' key
        if 'model' not in config:
            print("Warning: Config does not have 'model' key. Creating it from root level.")
            # Move all root-level keys to 'model' key
            model_config = {}
            for key in ['model_type', 'image_size', 'channels', 'latent_dim', 'generator_layers', 
                       'discriminator_layers', 'batch_size', 'learning_rate', 'epochs', 
                       'training_algorithm', 'device']:
                if key in config:
                    model_config[key] = config.pop(key)
            
            config['model'] = model_config
        
        model_config = config.get('model', {})
        print(f"Model config keys: {list(model_config.keys())}")
        
        model_type = args.model_name.lower()
        if model_type not in ['dcgan', 'vanilla_gan']:
            print(f"Unknown model type: {model_type}, defaulting to dcgan")
            model_type = 'dcgan'
        
        print(f"Building {model_type.upper()} model")
        
        # Import torch
        try:
            import torch
            print(f"PyTorch version: {torch.__version__}")
            print(f"CUDA available: {torch.cuda.is_available()}")
        except ImportError as e:
            print(f"Failed to import torch: {e}")
            sys.exit(1)
        
        model = None
        
        try:
            if model_type == 'dcgan':
                print("Importing DCGAN...")
                try:
                    from nesy_factory.GANs.dcgan import DCGAN, DCGANConfig
                    print("DCGAN imported successfully")
                except ImportError as e:
                    print(f"Failed to import DCGAN: {e}")
                    traceback.print_exc()
                    sys.exit(1)
                
                # Build DCGAN config from model_config
                dcgan_config_dict = {
                    'image_size': model_config.get('image_size', 64),
                    'channels': model_config.get('channels', 3),
                    'latent_dim': model_config.get('latent_dim', 100),
                    'training_algorithm': model_config.get('training_algorithm', 'backprop'),
                    'batch_size': model_config.get('batch_size', 32),
                    'learning_rate': model_config.get('learning_rate', 0.0002),
                    'epochs': model_config.get('epochs', 50),
                    'device': 'cuda' if torch.cuda.is_available() else 'cpu',
                }
                
                print(f"DCGAN config: {json.dumps(dcgan_config_dict, indent=2)}")
                
                try:
                    dcgan_config = DCGANConfig(**dcgan_config_dict)
                    model = DCGAN(dcgan_config)
                    print("DCGAN created successfully")
                except Exception as e:
                    print(f"Failed to create DCGAN: {e}")
                    traceback.print_exc()
                    sys.exit(1)
                    
            elif model_type == 'vanilla_gan':
                print("Importing VanillaGAN...")
                try:
                    from nesy_factory.GANs.vanilla_gan import VanillaGAN, VanillaGANConfig
                    print("VanillaGAN imported successfully")
                except ImportError as e:
                    print(f"Failed to import VanillaGAN: {e}")
                    traceback.print_exc()
                    sys.exit(1)
                
                # Build VanillaGAN config from model_config
                vanilla_config_dict = {
                    'input_dim': model_config.get('input_dim', 784),
                    'latent_dim': model_config.get('latent_dim', 100),
                    'training_algorithm': model_config.get('training_algorithm', 'backprop'),
                    'batch_size': model_config.get('batch_size', 64),
                    'lr': model_config.get('learning_rate', 0.0002),
                    'epochs': model_config.get('epochs', 50),
                    'device': 'cuda' if torch.cuda.is_available() else 'cpu',
                }
                
                print(f"VanillaGAN config: {json.dumps(vanilla_config_dict, indent=2)}")
                
                try:
                    vanilla_config = VanillaGANConfig(**vanilla_config_dict)
                    model = VanillaGAN(vanilla_config)
                    print("VanillaGAN created successfully")
                except Exception as e:
                    print(f"Failed to create VanillaGAN: {e}")
                    traceback.print_exc()
                    sys.exit(1)
                    
        except Exception as e:
            print(f"Unexpected error: {e}")
            traceback.print_exc()
            sys.exit(1)
        
        if model is None:
            print("Model creation failed")
            sys.exit(1)
        
        # Test model
        print("Testing model...")
        try:
            if model_type == 'dcgan':
                z = torch.randn(2, model_config.get('latent_dim', 100), 1, 1)
            else:
                z = torch.randn(2, model_config.get('latent_dim', 100))
            
            if hasattr(model, 'generator'):
                with torch.no_grad():
                    samples = model.generator(z)
                print(f"Generator test passed. Output shape: {samples.shape}")
        except Exception as e:
            print(f"Model test warning: {e}")
        
        # Create model info
        model_info = {
            'model_type': model_type,
            'model_name': args.model_name,
            'build_status': 'success',
        }
        
        # Update config
        config['model'] = model_config
        config['model_type'] = model_type
        config['model_name'] = args.model_name
        
        # Create combined info
        combined_info = {
            **model_info,
            **config,
        }
        
        # Create output directories
        os.makedirs(os.path.dirname(args.model_out) or '.', exist_ok=True)
        os.makedirs(os.path.dirname(args.config_updated) or '.', exist_ok=True)
        os.makedirs(os.path.dirname(args.model_info_out) or '.', exist_ok=True)
        
        # Save outputs
        with open(args.model_out, 'wb') as f:
            pickle.dump(model, f)
        
        with open(args.config_updated, 'w') as f:
            json.dump(config, f, indent=2)
        
        with open(args.model_info_out, 'w') as f:
            json.dump(combined_info, f, indent=2)
        
        print("="*60)
        print("GANBuildModel completed successfully")
        print(f"Model saved: {args.model_out}")
        print(f"Config saved: {args.config_updated}")
        print(f"Model info saved: {args.model_info_out}")
        print("="*60)

    args:
      - --model_name
      - {inputValue: model_name}
      - --config_str
      - {inputValue: config_str}
      - --model_out
      - {outputPath: model_out}
      - --config_updated
      - {outputPath: config_updated}
      - --model_info_out
      - {outputPath: model_info_out}
