name: Create GAN Continual Learning Tasks
description: Splits data into multiple tasks for GAN continual learning with support for DCGAN, Vanilla GAN, and different training algorithms
inputs:
  - name: train_data
    type: Dataset
  - name: gan_config_json
    type: String
    description: Master GAN configuration as JSON string
outputs:
  - name: continual_tasks
    type: Dataset
  - name: gan_config_updated
    type: String
    description: Updated GAN configuration for continual learning

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v34
    command:
      - sh
      - -c
      - |
        pip install torchvision==0.15.2 --quiet
        echo "Torchvision installed"
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import argparse
        import json
        import os
        import pickle
        import base64
        import numpy as np
        import torch
        from torch.utils.data import Dataset, DataLoader, Subset
        import random
        
        class GANTaskSplitter:
            
            def __init__(self, data, config):
                self.data = data
                self.config = config
                self.model_type = config.get('model', {}).get('gan_type', 'dcgan').lower()
                self.training_algorithm = config.get('model', {}).get('training_algorithm', 'backprop')
                
            def create_continual_tasks(self, num_tasks=3, strategy='temporal_split'):   
                
                if strategy == 'temporal_split':
                    return self._temporal_split(num_tasks)
                elif strategy == 'class_split':
                    return self._class_split(num_tasks)
                elif strategy == 'domain_split':
                    return self._domain_split(num_tasks)
                else:
                    return self._temporal_split(num_tasks)
            
            def _temporal_split(self, num_tasks):
           
                tasks = []
                dataset = self.data['dataset']
                total_samples = len(dataset)
                
                # Create temporal splits
                split_indices = np.array_split(range(total_samples), num_tasks)
                
                for task_id, indices in enumerate(split_indices):
                    # Create subset for this task
                    task_dataset = Subset(dataset, indices)
                    
                    # Create task-specific configuration
                    task_config = self._create_task_config(task_id, len(indices))
                    
                    task_data = {
                        'task_id': task_id,
                        'dataset': task_dataset,
                        'indices': indices.tolist(),
                        'num_samples': len(indices),
                        'config': task_config,
                        'description': f'GAN Temporal Task {task_id+1}/{num_tasks}',
                        'model_type': self.model_type,
                        'training_algorithm': self.training_algorithm
                    }
                    
                    tasks.append(task_data)
                
                return tasks
            
            def _class_split(self, num_tasks):
           
                tasks = []
                dataset = self.data['dataset']
                
                # Extract labels if available in data structure
                # This assumes data is stored in a specific format with labels
                try:
                    # Try to get labels from dataset items
                    labels = []
                    for i in range(min(100, len(dataset))):  # Sample first 100
                        item = dataset[i]
                        if isinstance(item, tuple) and len(item) == 2:
                            labels.append(item[1])
                        else:
                            labels.append(0)  # Default label
                    
                    unique_labels = list(set(labels))
                    print(f"Found {len(unique_labels)} unique labels")
                    
                    if len(unique_labels) >= num_tasks:
                        # Split by label
                        label_groups = {}
                        for label in unique_labels:
                            label_groups[label] = []
                        
                        # Group samples by label (limited to first 1000 for speed)
                        for i in range(min(1000, len(dataset))):
                            item = dataset[i]
                            if isinstance(item, tuple) and len(item) == 2:
                                label = item[1]
                                label_groups[label].append(i)
                        
                        # Distribute labels to tasks
                        tasks_per_label = max(1, num_tasks // len(unique_labels))
                        task_id = 0
                        
                        for label, indices in label_groups.items():
                            if indices and task_id < num_tasks:
                                task_dataset = Subset(dataset, indices)
                                task_config = self._create_task_config(task_id, len(indices))
                                
                                task_data = {
                                    'task_id': task_id,
                                    'dataset': task_dataset,
                                    'indices': indices,
                                    'num_samples': len(indices),
                                    'config': task_config,
                                    'description': f'GAN Class Task {task_id+1} (Label: {label})',
                                    'model_type': self.model_type,
                                    'training_algorithm': self.training_algorithm,
                                    'label': label
                                }
                                
                                tasks.append(task_data)
                                task_id += 1
                        
                        # If we have fewer tasks than requested, split remaining tasks temporally
                        if len(tasks) < num_tasks:
                            remaining_tasks = self._temporal_split(num_tasks - len(tasks))
                            for task in remaining_tasks:
                                task['task_id'] = len(tasks)
                                task['description'] = f'GAN Temporal Task {len(tasks)+1}/{num_tasks}'
                                tasks.append(task)
                    
                    else:
                        # Fall back to temporal split
                        tasks = self._temporal_split(num_tasks)
                        
                except Exception as e:
                    print(f"Class split failed, using temporal: {e}")
                    tasks = self._temporal_split(num_tasks)
                
                return tasks
            
            def _domain_split(self, num_tasks):
          
                tasks = []
                dataset = self.data['dataset']
                total_samples = len(dataset)
                
                # Simulate domains by splitting data into chunks and applying different transforms
                split_indices = np.array_split(range(total_samples), num_tasks)
                
                for task_id, indices in enumerate(split_indices):
                    # Create subset
                    task_dataset = Subset(dataset, indices)
                    
                    # Create domain-specific configuration
                    task_config = self._create_task_config(task_id, len(indices))
                    
                    # Simulate domain shift by modifying config
                    domain_shift = {
                        'brightness': random.uniform(0.8, 1.2),
                        'contrast': random.uniform(0.8, 1.2),
                        'noise_level': random.uniform(0.0, 0.1)
                    }
                    task_config['domain_shift'] = domain_shift
                    
                    task_data = {
                        'task_id': task_id,
                        'dataset': task_dataset,
                        'indices': indices.tolist(),
                        'num_samples': len(indices),
                        'config': task_config,
                        'description': f'GAN Domain Task {task_id+1}/{num_tasks}',
                        'model_type': self.model_type,
                        'training_algorithm': self.training_algorithm,
                        'domain_shift': domain_shift
                    }
                    
                    tasks.append(task_data)
                
                return tasks
            
            def _create_task_config(self, task_id, num_samples):

                base_config = self.config.copy()
                
                # Modify configuration for this task
                model_config = base_config.get('model', {})
                training_config = base_config.get('training', {})
                
                # Adjust learning rate for later tasks (continual learning)
                base_lr = model_config.get('learning_rate', 0.0002)
                task_lr = base_lr * (0.9 ** task_id)  # Decay learning rate
                model_config['learning_rate'] = task_lr
                
                # Adjust epochs for task
                base_epochs = training_config.get('epochs', 10)
                task_epochs = max(3, base_epochs // (task_id + 1))  # Fewer epochs for later tasks
                training_config['epochs'] = task_epochs
                
                # Task-specific parameters
                task_config = {
                    'task_id': task_id,
                    'num_samples': num_samples,
                    'model_config': model_config,
                    'training_config': training_config,
                    'requires_knowledge_replay': task_id > 0,  # Replay for tasks after first
                    'requires_regularization': task_id > 0,
                    'memory_size': min(100, num_samples // 10)  # Memory for replay
                }
                
                return task_config
        
        def main():
            parser = argparse.ArgumentParser()
            parser.add_argument('--train_data', type=str, required=True)
            parser.add_argument('--gan_config_json', type=str, required=True)
            parser.add_argument('--continual_tasks', type=str, required=True)
            parser.add_argument('--gan_config_updated', type=str, required=True)
            args = parser.parse_args()
            
            # Parse configuration
            config = json.loads(args.gan_config_json)
            
            # Load training data
            with open(args.train_data, 'rb') as f:
                data_wrapper = pickle.load(f)
            
            print(f"Creating GAN continual learning tasks")
            print(f"Model type: {config.get('model', {}).get('gan_type', 'dcgan')}")
            print(f"Training algorithm: {config.get('model', {}).get('training_algorithm', 'backprop')}")
            
            # Create task splitter
            splitter = GANTaskSplitter(data_wrapper, config)
            
            # Get strategy from config
            cl_config = config.get('continual_learning', {})
            strategy = cl_config.get('strategy', 'temporal_split')
            num_tasks = cl_config.get('num_tasks', 3)
            
            # Create tasks
            tasks = splitter.create_continual_tasks(num_tasks=num_tasks, strategy=strategy)
            
            print(f"Created {len(tasks)} GAN continual learning tasks")
            for task in tasks:
                print(f"Task {task['task_id']+1}: {task['description']} - Samples: {task['num_samples']}")
                if 'label' in task:
                    print(f"  Label: {task['label']}")
                if 'domain_shift' in task:
                    print(f"  Domain shift: {task['domain_shift']}")
            
            # Update configuration
            config['continual_learning'] = {
                'strategy': strategy,
                'num_tasks': num_tasks,
                'tasks_created': True,
                'task_descriptions': [task['description'] for task in tasks],
                'total_samples': sum(task['num_samples'] for task in tasks)
            }
            
            # Save outputs
            os.makedirs(os.path.dirname(args.continual_tasks), exist_ok=True)
            with open(args.continual_tasks, 'wb') as f:
                pickle.dump(tasks, f)
            
            # Convert updated config to base64 for compatibility
            updated_config_json = json.dumps(config)
            updated_config_base64 = base64.b64encode(updated_config_json.encode('utf-8')).decode('utf-8')
            
            os.makedirs(os.path.dirname(args.gan_config_updated), exist_ok=True)
            with open(args.gan_config_updated, 'w') as f:
                f.write(updated_config_base64)
            
            print(f"Saved {len(tasks)} tasks to {args.continual_tasks}")
            print(f"Updated config saved to {args.gan_config_updated}")
        
        if __name__ == '__main__':
            main()

    args:
      - --train_data
      - {inputPath: train_data}
      - --gan_config_json
      - {inputValue: gan_config_json}
      - --continual_tasks
      - {outputPath: continual_tasks}
      - --gan_config_updated
      - {outputPath: gan_config_updated}
