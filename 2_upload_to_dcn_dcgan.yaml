name: Upload GAN Results to CDN
description: Uploads training history, generated images, and metrics to CDN.
inputs:
  - name: training_history
    type: String
    description: "Training history JSON from Train GAN Model Enhanced component"
  - name: generated_images
    type: Dataset
    description: "Generated images pickle file from Train GAN Model Enhanced component"
  - name: training_metrics
    type: String
    description: "Training metrics from Train GAN Model Enhanced component"
  - name: bearer_token
    type: string
    description: "Access token from IAMLoginService component"
  - name: domain
    type: String
    description: "Domain for upload"
  - name: get_cdn
    type: String
    description: "CDN endpoint"
  - name: gan_config
    type: String
    description: "GAN configuration JSON string (pipeline parameter)"
outputs:
  - name: history_cdn_url
    type: String
    description: "CDN URL for training history JSON"
  - name: images_cdn_urls
    type: String
    description: "JSON array of CDN URLs for generated images"
  - name: metrics_cdn_url
    type: String
    description: "CDN URL for training metrics"
  - name: upload_summary
    type: String
    description: "Summary of uploads"

implementation:
  container:
    image: python:3.8-slim
    command:
      - sh
      - -c
      - |
        set -e
        
        echo "Installing required packages..."
        apt-get update > /dev/null
        
        # Install curl if not present
        if ! command -v curl &> /dev/null; then
            echo "Installing curl..."
            apt-get install -y curl > /dev/null
        fi
        
        # Install Python packages
        echo "Installing Python packages..."
        pip install Pillow > /dev/null
        
        echo "Starting the Python script..."
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import sys, os, subprocess, json, pickle, tempfile, time, argparse, base64, io
        from PIL import Image
        
        parser = argparse.ArgumentParser()
        parser.add_argument('--training_history_path', type=str, required=True)
        parser.add_argument('--generated_images_path', type=str, required=True)
        parser.add_argument('--training_metrics_path', type=str, required=True)
        parser.add_argument('--bearer_token', type=str, required=True)
        parser.add_argument('--domain', type=str, required=True)
        parser.add_argument('--get_cdn', type=str, required=True)
        parser.add_argument('--gan_config', type=str, required=True)
        parser.add_argument('--history_cdn_url_path', type=str, required=True)
        parser.add_argument('--images_cdn_urls_path', type=str, required=True)
        parser.add_argument('--metrics_cdn_url_path', type=str, required=True)
        parser.add_argument('--upload_summary_path', type=str, required=True)
        args = parser.parse_args()
        
        print('=== DEBUG: Input Values ===')
        print(f"1. training_history_path: {args.training_history_path}")
        print(f"2. generated_images_path: {args.generated_images_path}")
        print(f"3. training_metrics_path: {args.training_metrics_path}")
        print(f"4. bearer_token (first 50 chars): {args.bearer_token[:50] if len(args.bearer_token) > 50 else args.bearer_token}")
        print(f"5. domain: {args.domain}")
        print(f"6. get_cdn: {args.get_cdn}")
        print(f"7. gan_config length: {len(args.gan_config)} chars")
        print('===========================')
        
        print('Starting GAN Results CDN Upload')
        
        # Parse JSON config
        try:
            gan_config = json.loads(args.gan_config)
            print("Successfully parsed gan_config JSON")
        except json.JSONDecodeError as e:
            print(f"Error parsing gan_config JSON: {e}")
            print(f"Raw gan_config: {args.gan_config}")
            sys.exit(1)
        
        # Load training history
        try:
            with open(args.training_history_path, 'r') as f:
                training_history = json.load(f)
            print("Successfully loaded training_history")
        except Exception as e:
            print(f"Error loading training_history: {e}")
            training_history = {}
        
        # Load training metrics
        try:
            with open(args.training_metrics_path, 'r') as f:
                training_metrics = json.load(f)
            print("Successfully loaded training_metrics")
        except Exception as e:
            print(f"Error loading training_metrics: {e}")
            training_metrics = {}
        
        # Load generated images
        try:
            with open(args.generated_images_path, 'rb') as f:
                generated_images = pickle.load(f)
            print(f"Successfully loaded generated_images: {len(generated_images)} images")
        except Exception as e:
            print(f"Error loading generated_images: {e}")
            generated_images = []
        
        bearer_token = args.bearer_token.strip()
        
        upload_url = f"{args.domain}/mobius-content-service/v1.0/content/upload?filePathAccess=private&filePath=%2Fbottle%2Flimka%2Fsoda%2F"
        print(f"Upload URL: {upload_url}")
        
        # Function to upload file to CDN
        def upload_file_to_cdn(file_path, filename):
            print(f'Uploading {filename}...')
            
            curl_command = [
                "curl",
                "--location", upload_url,
                "--header", f"Authorization: Bearer {bearer_token}",
                "--form", f"file=@{file_path}",
                "--fail",
                "--show-error",
                "--silent"
            ]
            
            try:
                process = subprocess.run(
                    curl_command,
                    capture_output=True,
                    text=True,
                    check=True
                )
                
                response_json = json.loads(process.stdout)
                relative_cdn_url = response_json.get("cdnUrl", "")
                
                if not relative_cdn_url:
                    print('Error: No CDN URL in response')
                    return None
                
                full_url = f"{args.get_cdn}{relative_cdn_url}"
                print(f'Upload successful: {full_url}')
                return full_url
                
            except subprocess.CalledProcessError as e:
                print(f'Curl error: {e.returncode}')
                print(f'Error output: {e.stderr}')
                return None
            except json.JSONDecodeError as e:
                print(f'JSON parse error: {e}')
                return None
        
        timestamp = time.strftime('%Y%m%d_%H%M%S')
        history_url = None
        metrics_url = None
        image_urls = []
        
        with tempfile.TemporaryDirectory() as temp_dir:
            print(f"Using temp directory: {temp_dir}")
            
            # 1. Upload training history
            history_file_path = os.path.join(temp_dir, f'training_history_{timestamp}.json')
            with open(history_file_path, 'w') as f:
                json.dump(training_history, f, indent=2)
            
            history_url = upload_file_to_cdn(history_file_path, f'training_history_{timestamp}.json')
            
            # 2. Upload training metrics
            metrics_file_path = os.path.join(temp_dir, f'training_metrics_{timestamp}.json')
            with open(metrics_file_path, 'w') as f:
                json.dump(training_metrics, f, indent=2)
            
            metrics_url = upload_file_to_cdn(metrics_file_path, f'training_metrics_{timestamp}.json')
            
            # 3. Upload generated images
            print(f"Processing {len(generated_images)} generated images...")
            
            for i, image_data in enumerate(generated_images):
                try:
                    # Extract image data from the sample dict
                    if isinstance(image_data, dict) and 'image_data' in image_data:
                        img_base64 = image_data['image_data']
                        
                        # Decode base64
                        img_bytes = base64.b64decode(img_base64)
                        image_filename = f'generated_image_{timestamp}_{i+1}.png'
                        image_file_path = os.path.join(temp_dir, image_filename)
                        
                        # Save image
                        with open(image_file_path, 'wb') as f:
                            f.write(img_bytes)
                        
                        # Upload image
                        img_url = upload_file_to_cdn(image_file_path, image_filename)
                        if img_url:
                            image_urls.append({
                                'index': i+1,
                                'filename': image_filename,
                                'url': img_url
                            })
                            print(f"Uploaded image {i+1}/{len(generated_images)}")
                        
                except Exception as e:
                    print(f"Error processing image {i+1}: {e}")
                    continue
        
        # Create upload summary
        upload_summary = {
            'timestamp': timestamp,
            'upload_time': time.strftime('%Y-%m-%d %H:%M:%S'),
            'history_uploaded': history_url is not None,
            'history_url': history_url if history_url else '',
            'metrics_uploaded': metrics_url is not None,
            'metrics_url': metrics_url if metrics_url else '',
            'images_uploaded': len(image_urls),
            'images_total': len(generated_images),
            'image_urls': image_urls,
            'summary': {
                'total_files': 2 + len(image_urls),
                'successful_uploads': (1 if history_url else 0) + (1 if metrics_url else 0) + len(image_urls),
                'failed_uploads': (0 if history_url else 1) + (0 if metrics_url else 1) + (len(generated_images) - len(image_urls))
            }
        }
        
        # Save outputs
        os.makedirs(os.path.dirname(args.history_cdn_url_path) or '.', exist_ok=True)
        with open(args.history_cdn_url_path, 'w') as f:
            f.write(history_url if history_url else '')
        
        os.makedirs(os.path.dirname(args.images_cdn_urls_path) or '.', exist_ok=True)
        with open(args.images_cdn_urls_path, 'w') as f:
            json.dump(image_urls, f, indent=2)
        
        os.makedirs(os.path.dirname(args.metrics_cdn_url_path) or '.', exist_ok=True)
        with open(args.metrics_cdn_url_path, 'w') as f:
            f.write(metrics_url if metrics_url else '')
        
        os.makedirs(os.path.dirname(args.upload_summary_path) or '.', exist_ok=True)
        with open(args.upload_summary_path, 'w') as f:
            json.dump(upload_summary, f, indent=2)
        
        print('\\n=== GAN Results CDN Upload Summary ===')
        print(f'  Training history uploaded: {"Yes" if history_url else "No"}')
        print(f'  Training metrics uploaded: {"Yes" if metrics_url else "No"}')
        print(f'  Images uploaded: {len(image_urls)}/{len(generated_images)}')
        print('====================================')

    args:
      - --training_history_path
      - {inputPath: training_history}
      - --generated_images_path
      - {inputPath: generated_images}
      - --training_metrics_path
      - {inputPath: training_metrics}
      - --bearer_token
      - {inputValue: bearer_token}
      - --domain
      - {inputValue: domain}
      - --get_cdn
      - {inputValue: get_cdn}
      - --gan_config
      - {inputValue: gan_config}
      - --history_cdn_url_path
      - {outputPath: history_cdn_url}
      - --images_cdn_urls_path
      - {outputPath: images_cdn_urls}
      - --metrics_cdn_url_path
      - {outputPath: metrics_cdn_url}
      - --upload_summary_path
      - {outputPath: upload_summary}
