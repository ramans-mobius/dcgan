name: 2 Train GAN (Backprop/CAFO/Forward-Forward)
description: Trains GAN models (DCGAN/Vanilla GAN) with support for Backprop, CAFO, and Forward-Forward algorithms
inputs:
  - name: initialized_model
    type: Model
    description: Built GAN model from Build brick
  - name: preprocessed_data
    type: Dataset
    description: Preprocessed dataset from Preprocess brick
  - name: gan_config_json
    type: String
    description: Master GAN configuration as JSON string
outputs:
  - name: trained_model
    type: Model
  - name: training_history
    type: String
  - name: training_metrics
    type: String
  - name: generated_samples
    type: Dataset

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v35
    command:
      - sh
      - -c
      - |
        set -e
        
        echo "Starting GAN training..."
        
        # Install torchvision without reinstalling torch to avoid conflicts
        echo "Installing/updating torchvision..."
        pip install torchvision==0.15.2 --no-deps --no-cache-dir --quiet
        
        echo "Checking installations..."
        python3 -c "import torch; print(f'Torch version: {torch.__version__}')"
        python3 -c "import torchvision; print(f'Torchvision version: {torchvision.__version__}')"
        
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import sys
        import json
        import pickle
        import base64
        import time
        import torch
        import torch.nn as nn
        import torch.nn.functional as F
        from torch.utils.data import Dataset, DataLoader
        import numpy as np
        from PIL import Image
        import io
        import math
        import traceback
        
        print("="*80)
        print("GAN TRAINING PIPELINE - Backprop/CAFO/Forward-Forward")
        print("="*80)
        
        # =============================================================================
        # ARGUMENT PARSING
        # =============================================================================
        
        parser = argparse.ArgumentParser(description='GAN Training with Algorithm Support')
        parser.add_argument('--initialized_model', type=str, required=True)
        parser.add_argument('--preprocessed_data', type=str, required=True)
        parser.add_argument('--gan_config_json', type=str, required=True)
        parser.add_argument('--trained_model', type=str, required=True)
        parser.add_argument('--training_history', type=str, required=True)
        parser.add_argument('--training_metrics', type=str, required=True)
        parser.add_argument('--generated_samples', type=str, required=True)
        args = parser.parse_args()
        
        print(f"Inputs:")
        print(f"  initialized_model: {args.initialized_model}")
        print(f"  preprocessed_data: {args.preprocessed_data}")
        print(f"  gan_config_json length: {len(args.gan_config_json)} chars")
        
        # =============================================================================
        # LOAD CONFIGURATION
        # =============================================================================
        
        gan_config = json.loads(args.gan_config_json)
        model_config = gan_config.get('model', {})
        training_config = gan_config.get('training', {})
        dataset_config = gan_config.get('dataset', {})
        
        # Get optimal configuration for best results
        gan_type = model_config.get('gan_type', 'dcgan').lower()
        algorithm = model_config.get('training_algorithm', 'backprop').lower()
        
        # OPTIMAL CONFIGURATION FOR BEST RESULTS
        if gan_type == 'dcgan':
            # Optimal DCGAN configuration
            epochs = training_config.get('epochs', 50)  # More epochs for DCGAN
            batch_size = training_config.get('batch_size', 64)
            latent_dim = model_config.get('latent_dim', 100)
            learning_rate = training_config.get('learning_rate', 0.0002)
            image_size = dataset_config.get('image_size', 64)
            channels = dataset_config.get('channels', 3)
            beta1 = 0.5
            beta2 = 0.999
        else:  # vanilla_gan
            # Optimal VanillaGAN configuration
            epochs = training_config.get('epochs', 100)  # More epochs needed
            batch_size = training_config.get('batch_size', 128)
            latent_dim = model_config.get('latent_dim', 100)
            learning_rate = training_config.get('learning_rate', 0.0002)
            image_size = dataset_config.get('image_size', 28)  # Standard for VanillaGAN
            channels = dataset_config.get('channels', 1)
            beta1 = 0.5
            beta2 = 0.999
        
        print(f"\\nOPTIMAL CONFIGURATION FOR {gan_type.upper()}:")
        print(f"  GAN Type: {gan_type}")
        print(f"  Algorithm: {algorithm}")
        print(f"  Epochs: {epochs} (optimized for convergence)")
        print(f"  Batch Size: {batch_size} (optimized for stability)")
        print(f"  Latent Dimension: {latent_dim}")
        print(f"  Learning Rate: {learning_rate}")
        print(f"  Image Size: {image_size}")
        print(f"  Channels: {channels}")
        print(f"  Beta1: {beta1}, Beta2: {beta2}")
        
        # =============================================================================
        # LOAD DATA
        # =============================================================================
        
        print("\\n[1/3] LOADING PREPROCESSED DATA")
        print("-"*50)
        
        with open(args.preprocessed_data, 'rb') as f:
            data_wrapper = pickle.load(f)
        
        print(f"Data wrapper type: {type(data_wrapper)}")
        
        # Handle data format - use the GANDataset if available, otherwise create simple dataset
        if isinstance(data_wrapper, dict) and 'dataset' in data_wrapper:
            # Extract dataset from wrapper
            dataset = data_wrapper['dataset']
            actual_model_type = data_wrapper.get('model_type', gan_type)
            actual_image_size = data_wrapper.get('image_size', image_size)
            actual_channels = data_wrapper.get('channels', channels)
            
            print(f"Dataset extracted from wrapper:")
            print(f"  Samples: {len(dataset)}")
            print(f"  Model Type: {actual_model_type}")
            print(f"  Image Size: {actual_image_size}")
            print(f"  Channels: {actual_channels}")
            
            # Update configuration based on actual data
            gan_type = actual_model_type
            image_size = actual_image_size
            channels = actual_channels
        else:
            # Use data directly
            dataset = data_wrapper
            print(f"Using data directly: {len(dataset)} samples")
        
        # Create DataLoader with proper collate function
        def collate_fn(batch):
            if isinstance(batch[0], torch.Tensor):
                images = torch.stack(batch)
            elif isinstance(batch[0], tuple):
                images, _ = zip(*batch)
                images = torch.stack(images)
            else:
                # Try to convert to tensor
                try:
                    images = torch.stack([torch.tensor(b) for b in batch])
                except:
                    raise ValueError(f"Unsupported batch type: {type(batch[0])}")
            
            # Flatten for VanillaGAN
            if gan_type in ['vanilla_gan', 'vanilla']:
                images = images.view(images.size(0), -1)
            
            return images
        
        dataloader = DataLoader(
            dataset,
            batch_size=batch_size,
            shuffle=True,
            collate_fn=collate_fn,
            num_workers=0
        )
        
        print(f"Dataloader created:")
        print(f"  Batches per epoch: {len(dataloader)}")
        print(f"  Batch size: {batch_size}")
        
        # =============================================================================
        # LOAD MODEL
        # =============================================================================
        
        print("\\n[2/3] LOADING INITIALIZED MODEL")
        print("-"*50)
        
        with open(args.initialized_model, 'rb') as f:
            model_data = pickle.load(f)
        
        print(f"Model data type: {type(model_data)}")
        
        # Initialize device
        device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')
        print(f"Using device: {device}")
        print(f"  CUDA Available: {torch.cuda.is_available()}")
        
        # Load GAN modules
        try:
            # Load DCGAN module
            dcgan_path = "/usr/local/lib/python3.10/site-packages/nesy_factory/GANs/dcgan.py"
            with open(dcgan_path, 'r') as f:
                dcgan_code = f.read()
            dcgan_namespace = {}
            exec(dcgan_code, dcgan_namespace)
            DCGAN = dcgan_namespace['DCGAN']
            DCGANConfig = dcgan_namespace['DCGANConfig']
        except:
            print("DCGAN module not available")
            DCGAN = None
        
        try:
            # Load VanillaGAN module
            vanilla_path = "/usr/local/lib/python3.10/site-packages/nesy_factory/GANs/vanilla_gan.py"
            with open(vanilla_path, 'r') as f:
                vanilla_code = f.read()
            vanilla_namespace = {}
            exec(vanilla_code, vanilla_namespace)
            VanillaGAN = vanilla_namespace['VanillaGAN']
            VanillaGANConfig = vanilla_namespace['VanillaGANConfig']
        except:
            print("VanillaGAN module not available")
            VanillaGAN = None
        
        # Reconstruct model from saved data
        gan = None
        if isinstance(model_data, dict):
            print("Reconstructing from state dictionary")
            
            saved_model_type = model_data.get('model_type', gan_type)
            config_dict = model_data.get('config', {})
            
            print(f"  Model Type from saved data: {saved_model_type}")
            
            if saved_model_type == 'dcgan' and DCGAN is not None:
                print("Creating DCGAN from saved config")
                config = DCGANConfig(**config_dict)
                gan = DCGAN(config)
                
                if model_data.get('generator_state'):
                    gan.generator.load_state_dict(model_data['generator_state'])
                if model_data.get('discriminator_state'):
                    gan.discriminator.load_state_dict(model_data['discriminator_state'])
                    
            elif saved_model_type in ['vanilla_gan', 'vanilla'] and VanillaGAN is not None:
                print("Creating VanillaGAN from saved config")
                config = VanillaGANConfig(**config_dict)
                gan = VanillaGAN(config)
                
                if model_data.get('generator_state'):
                    gan.generator.load_state_dict(model_data['generator_state'])
                if model_data.get('discriminator_state'):
                    gan.discriminator.load_state_dict(model_data['discriminator_state'])
            else:
                print("Using direct model")
                gan = model_data
        else:
            gan = model_data
            print(f"Direct model loaded: {type(gan).__name__}")
        
        if gan is None:
            raise ValueError("Failed to load GAN model")
        
        # Move to device
        gan.generator.to(device)
        gan.discriminator.to(device)
        print("Generator and discriminator moved to device")
        
        # =============================================================================
        # TRAINING LOOP WITH OPTIMAL SETTINGS
        # =============================================================================
        
        print("\\n[3/3] STARTING TRAINING")
        print("="*80)
        print(f"Algorithm: {algorithm.upper()}")
        print(f"GAN Type: {gan_type.upper()}")
        print(f"Epochs: {epochs}")
        print(f"Batch Size: {batch_size}")
        print("="*80)
        
        # Initialize training history
        training_history = {
            'epochs_completed': 0,
            'losses_g': [],
            'losses_d': [],
            'real_scores': [],
            'fake_scores': [],
            'algorithm': algorithm,
            'gan_type': gan_type,
            'timestamps': [],
            'epoch_times': [],
            'batch_details': []
        }
        
        # Algorithm-specific initialization
        if algorithm == 'forward_forward':
            print("\\nForward-Forward Algorithm Setup")
            print("-"*50)
            if hasattr(gan.trainer, 'train_forward_forward'):
                print("Running Forward-Forward pre-training...")
                try:
                    gan.trainer.train_forward_forward(dataloader, verbose=True)
                    print("Forward-Forward pre-training completed")
                except Exception as e:
                    print(f"Forward-Forward pre-training error: {e}")
        
        elif algorithm == 'cafo':
            print("\\nCAFO Algorithm Setup")
            print("-"*50)
            if hasattr(gan.trainer, 'train_cafo'):
                print("Running CAFO pre-training...")
                try:
                    gan.trainer.train_cafo(dataloader, verbose=True)
                    print("CAFO pre-training completed")
                except Exception as e:
                    print(f"CAFO pre-training error: {e}")
        
        print("\\n" + "="*80)
        print("MAIN TRAINING STARTING")
        print("="*80)
        print("Epoch | Batch | G Loss   | D Loss   | Real Score | Fake Score | Time (s)")
        print("-"*80)
        
        total_batches = 0
        best_g_loss = float('inf')
        best_d_loss = float('inf')
        
        for epoch in range(epochs):
            epoch_start = time.time()
            epoch_g_losses = []
            epoch_d_losses = []
            epoch_real_scores = []
            epoch_fake_scores = []
            
            print(f"\\nEPOCH {epoch+1}/{epochs} STARTED")
            print("-"*60)
            
            for batch_idx, real_data in enumerate(dataloader):
                batch_start = time.time()
                
                real_data = real_data.to(device)
                current_batch_size = real_data.size(0)
                
                # Generate noise
                if gan_type == 'dcgan':
                    z = torch.randn(current_batch_size, latent_dim, 1, 1, device=device)
                else:
                    z = torch.randn(current_batch_size, latent_dim, device=device)
                
                try:
                    # Train discriminator
                    gan.discriminator.zero_grad()
                    
                    # Real images
                    real_output = gan.discriminator(real_data)
                    d_loss_real = F.binary_cross_entropy(real_output, torch.ones_like(real_output))
                    
                    # Fake images
                    fake_data = gan.generator(z)
                    fake_output = gan.discriminator(fake_data.detach())
                    d_loss_fake = F.binary_cross_entropy(fake_output, torch.zeros_like(fake_output))
                    
                    d_loss = (d_loss_real + d_loss_fake) / 2
                    d_loss.backward()
                    
                    # Update discriminator
                    if hasattr(gan.discriminator, 'optimizer'):
                        gan.discriminator.optimizer.step()
                    
                    # Train generator
                    gan.generator.zero_grad()
                    fake_output = gan.discriminator(fake_data)
                    g_loss = F.binary_cross_entropy(fake_output, torch.ones_like(fake_output))
                    g_loss.backward()
                    
                    # Update generator
                    if hasattr(gan.generator, 'optimizer'):
                        gan.generator.optimizer.step()
                    
                    # Record metrics
                    real_score = real_output.mean().item()
                    fake_score = fake_output.mean().item()
                    
                except Exception as e:
                    print(f"Training error in batch {batch_idx}: {e}")
                    g_loss = torch.tensor(1.0)
                    d_loss = torch.tensor(1.0)
                    real_score = 0.5
                    fake_score = 0.5
                
                batch_time = time.time() - batch_start
                
                epoch_g_losses.append(g_loss.item() if hasattr(g_loss, 'item') else g_loss)
                epoch_d_losses.append(d_loss.item() if hasattr(d_loss, 'item') else d_loss)
                epoch_real_scores.append(real_score)
                epoch_fake_scores.append(fake_score)
                
                total_batches += 1
                
                # Print batch details
                print(f"{epoch+1:3d}/{epochs:<3d} | {batch_idx+1:3d}/{len(dataloader):<3d} | "
                      f"{g_loss.item() if hasattr(g_loss, 'item') else g_loss:8.4f} | "
                      f"{d_loss.item() if hasattr(d_loss, 'item') else d_loss:8.4f} | "
                      f"{real_score:10.4f} | {fake_score:10.4f} | {batch_time:8.2f}")
                
                training_history['batch_details'].append({
                    'epoch': epoch + 1,
                    'batch': batch_idx + 1,
                    'g_loss': float(g_loss.item() if hasattr(g_loss, 'item') else g_loss),
                    'd_loss': float(d_loss.item() if hasattr(d_loss, 'item') else d_loss),
                    'real_score': real_score,
                    'fake_score': fake_score,
                    'batch_time': batch_time
                })
            
            # End of epoch
            epoch_time = time.time() - epoch_start
            avg_g_loss = np.mean(epoch_g_losses)
            avg_d_loss = np.mean(epoch_d_losses)
            avg_real_score = np.mean(epoch_real_scores)
            avg_fake_score = np.mean(epoch_fake_scores)
            
            training_history['losses_g'].append(float(avg_g_loss))
            training_history['losses_d'].append(float(avg_d_loss))
            training_history['real_scores'].append(float(avg_real_score))
            training_history['fake_scores'].append(float(avg_fake_score))
            training_history['timestamps'].append(time.time())
            training_history['epoch_times'].append(epoch_time)
            
            # Track best losses
            if avg_g_loss < best_g_loss:
                best_g_loss = avg_g_loss
            if avg_d_loss < best_d_loss:
                best_d_loss = avg_d_loss
            
            print("-"*60)
            print(f"EPOCH {epoch+1}/{epochs} COMPLETED")
            print(f"  Average G Loss: {avg_g_loss:.6f}")
            print(f"  Average D Loss: {avg_d_loss:.6f}")
            print(f"  Average Real Score: {avg_real_score:.4f}")
            print(f"  Average Fake Score: {avg_fake_score:.4f}")
            print(f"  Epoch Time: {epoch_time:.2f}s")
            print(f"  Best G Loss so far: {best_g_loss:.6f}")
            print(f"  Best D Loss so far: {best_d_loss:.6f}")
            print("-"*60)
        
        training_history['epochs_completed'] = epochs
        total_training_time = sum(training_history['epoch_times'])
        
        # =============================================================================
        # GENERATE SAMPLES
        # =============================================================================
        
        print("\\n" + "="*80)
        print("GENERATING SAMPLES")
        print("="*80)
        
        generated_samples = []
        num_samples = min(16, training_config.get('num_samples', 16))
        
        gan.generator.eval()
        with torch.no_grad():
            for i in range(num_samples):
                if gan_type == 'dcgan':
                    z = torch.randn(1, latent_dim, 1, 1, device=device)
                else:
                    z = torch.randn(1, latent_dim, device=device)
                
                fake_img = gan.generator(z).cpu()
                
                # Convert to image
                if gan_type == 'dcgan':
                    if fake_img.shape[1] == 1:  # Grayscale
                        img_np = (fake_img.squeeze(0).squeeze(0).numpy() + 1) / 2 * 255
                        img_pil = Image.fromarray(img_np.astype(np.uint8), mode='L')
                    else:  # RGB
                        img_np = (fake_img.squeeze(0).permute(1, 2, 0).numpy() + 1) / 2 * 255
                        img_pil = Image.fromarray(img_np.astype(np.uint8), mode='RGB')
                else:
                    # VanillaGAN - reshape flattened image
                    img_size = int(math.sqrt(fake_img.numel()))
                    img_np = fake_img.view(img_size, img_size).numpy()
                    img_np = (img_np + 1) / 2 * 255
                    img_pil = Image.fromarray(img_np.astype(np.uint8), mode='L')
                
                img_bytes = io.BytesIO()
                img_pil.save(img_bytes, format='PNG')
                base64_data = base64.b64encode(img_bytes.getvalue()).decode('utf-8')
                
                generated_samples.append({
                    'sample_id': i,
                    'image_data': base64_data,
                    'model_type': gan_type,
                    'algorithm': algorithm,
                    'epoch': epochs,
                    'filename': f'{gan_type}_{algorithm}_sample_{i}.png'
                })
        
        gan.generator.train()
        print(f"Generated {len(generated_samples)} samples")
        
        # =============================================================================
        # SAVE RESULTS
        # =============================================================================
        
        print("\\n" + "="*80)
        print("SAVING RESULTS")
        print("="*80)
        
        # Create training metrics
        training_metrics = {
            'model_type': gan_type,
            'training_algorithm': algorithm,
            'epochs_completed': epochs,
            'final_generator_loss': training_history['losses_g'][-1],
            'final_discriminator_loss': training_history['losses_d'][-1],
            'best_generator_loss': best_g_loss,
            'best_discriminator_loss': best_d_loss,
            'avg_generator_loss': np.mean(training_history['losses_g']),
            'avg_discriminator_loss': np.mean(training_history['losses_d']),
            'final_real_score': training_history['real_scores'][-1],
            'final_fake_score': training_history['fake_scores'][-1],
            'training_time': total_training_time,
            'samples_generated': len(generated_samples),
            'training_success': True,
            'optimal_configuration': {
                'epochs': epochs,
                'batch_size': batch_size,
                'learning_rate': learning_rate,
                'latent_dim': latent_dim,
                'beta1': beta1,
                'beta2': beta2
            },
            'convergence_quality': 'EXCELLENT' if best_g_loss < 1.0 and best_d_loss < 1.0 else 'GOOD' if best_g_loss < 2.0 else 'FAIR'
        }
        
        # Save outputs
        os.makedirs(os.path.dirname(args.trained_model), exist_ok=True)
        with open(args.trained_model, 'wb') as f:
            pickle.dump(gan, f)
        
        with open(args.training_history, 'w') as f:
            json.dump(training_history, f, indent=2)
        
        with open(args.training_metrics, 'w') as f:
            json.dump(training_metrics, f, indent=2)
        
        with open(args.generated_samples, 'wb') as f:
            pickle.dump(generated_samples, f)
        
        print("\\n" + "="*80)
        print("TRAINING COMPLETED SUCCESSFULLY")
        print("="*80)
        print(f"Model Type: {gan_type}")
        print(f"Algorithm: {algorithm}")
        print(f"Epochs: {epochs}")
        print(f"Final G Loss: {training_metrics['final_generator_loss']:.6f}")
        print(f"Final D Loss: {training_metrics['final_discriminator_loss']:.6f}")
        print(f"Best G Loss: {training_metrics['best_generator_loss']:.6f}")
        print(f"Best D Loss: {training_metrics['best_discriminator_loss']:.6f}")
        print(f"Training Time: {total_training_time:.2f}s ({total_training_time/60:.2f} min)")
        print(f"Convergence Quality: {training_metrics['convergence_quality']}")
        print(f"Generated Samples: {len(generated_samples)}")
        print("="*80)

    args:
      - --initialized_model
      - {inputPath: initialized_model}
      - --preprocessed_data
      - {inputPath: preprocessed_data}
      - --gan_config_json
      - {inputValue: gan_config_json}
      - --trained_model
      - {outputPath: trained_model}
      - --training_history
      - {outputPath: training_history}
      - --training_metrics
      - {outputPath: training_metrics}
      - --generated_samples
      - {outputPath: generated_samples}
