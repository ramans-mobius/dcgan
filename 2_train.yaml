name: 2 Train GAN (Backprop/CAFO/Forward-Forward)
description: Trains GAN models (DCGAN/Vanilla GAN) with support for Backprop, CAFO, and Forward-Forward algorithms
inputs:
  - name: initialized_model
    type: Model
    description: Built GAN model from Build brick
  - name: preprocessed_data
    type: Dataset
    description: Preprocessed dataset from Preprocess brick
  - name: gan_config_json
    type: String
    description: Master GAN configuration as JSON string
outputs:
  - name: trained_model
    type: Model
  - name: training_history
    type: String
  - name: training_metrics
    type: String
  - name: generated_samples
    type: Dataset

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v35
    command:
      - sh
      - -c
      - |
        set -e
        
        echo "Starting GAN training..."
        echo "Installing torchvision and numpy..."
        pip install torchvision==0.15.2 numpy --quiet
        echo "Dependencies installed"
        
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import sys
        import json
        import pickle
        import base64
        import time
        import torch
        import torch.nn as nn
        import torch.nn.functional as F
        from torch.utils.data import Dataset, DataLoader
        import numpy as np
        from PIL import Image
        import io
        import math
        import traceback
        from torchvision import transforms
        
        print("="*80)
        print("GAN TRAINING PIPELINE - Backprop/CAFO/Forward-Forward")
        print("="*80)
        
        # =============================================================================
        # GANDataset CLASS (MUST BE DEFINED BEFORE LOADING PICKLE)
        # =============================================================================
        
        class GANDataset(Dataset):
            def __init__(self, data_list, transform=None, model_type='dcgan', target_size=64, channels=1):
                self.data_list = data_list
                self.transform = transform
                self.model_type = model_type
                self.target_size = target_size
                self.channels = channels
            
            def __len__(self):
                return len(self.data_list)
            
            def __getitem__(self, idx):
                item = self.data_list[idx]
                try:
                    if isinstance(item, dict) and 'image_data' in item:
                        img_data = base64.b64decode(item['image_data'])
                        img = Image.open(io.BytesIO(img_data))
                        
                        if self.channels == 1 and img.mode != 'L':
                            img = img.convert('L')
                        elif self.channels == 3 and img.mode != 'RGB':
                            img = img.convert('RGB')
                        
                        if self.transform:
                            img = self.transform(img)
                        
                        return img
                    elif isinstance(item, torch.Tensor):
                        return item
                    elif isinstance(item, tuple):
                        return item[0]  # Return just the image
                    else:
                        return torch.zeros(self.channels, self.target_size, self.target_size)
                except Exception as e:
                    print(f"Error processing image {idx}: {e}")
                    return torch.zeros(self.channels, self.target_size, self.target_size)
        
        # =============================================================================
        # ARGUMENT PARSING
        # =============================================================================
        
        parser = argparse.ArgumentParser(description='GAN Training with Algorithm Support')
        parser.add_argument('--initialized_model', type=str, required=True)
        parser.add_argument('--preprocessed_data', type=str, required=True)
        parser.add_argument('--gan_config_json', type=str, required=True)
        parser.add_argument('--trained_model', type=str, required=True)
        parser.add_argument('--training_history', type=str, required=True)
        parser.add_argument('--training_metrics', type=str, required=True)
        parser.add_argument('--generated_samples', type=str, required=True)
        args = parser.parse_args()
        
        print(f"Inputs:")
        print(f"  initialized_model: {args.initialized_model}")
        print(f"  preprocessed_data: {args.preprocessed_data}")
        print(f"  gan_config_json length: {len(args.gan_config_json)} chars")
        
        # =============================================================================
        # LOAD CONFIGURATION
        # =============================================================================
        
        gan_config = json.loads(args.gan_config_json)
        model_config = gan_config.get('model', {})
        training_config = gan_config.get('training', {})
        dataset_config = gan_config.get('dataset', {})
        
        gan_type = model_config.get('gan_type', 'dcgan').lower()
        algorithm = model_config.get('training_algorithm', 'backprop').lower()
        latent_dim = model_config.get('latent_dim', 100)
        epochs = training_config.get('epochs', 10)
        batch_size = training_config.get('batch_size', 32)
        image_size = dataset_config.get('image_size', 64)
        channels = dataset_config.get('channels', 1)
        learning_rate = training_config.get('learning_rate', 0.0002)
        
        print(f"\\nCONFIGURATION:")
        print(f"  GAN Type: {gan_type}")
        print(f"  Algorithm: {algorithm}")
        print(f"  Latent Dimension: {latent_dim}")
        print(f"  Epochs: {epochs}")
        print(f"  Batch Size: {batch_size}")
        print(f"  Image Size: {image_size}")
        print(f"  Channels: {channels}")
        print(f"  Learning Rate: {learning_rate}")
        
        # =============================================================================
        # LOAD DATA (WITH GANDataset CLASS DEFINED)
        # =============================================================================
        
        print("\\n[1/4] LOADING PREPROCESSED DATA")
        print("-"*50)
        
        try:
            with open(args.preprocessed_data, 'rb') as f:
                data_wrapper = pickle.load(f)
            
            print(f"Data wrapper type: {type(data_wrapper)}")
            
            if isinstance(data_wrapper, dict) and 'dataset' in data_wrapper:
                dataset_obj = data_wrapper['dataset']
                wrapper_model_type = data_wrapper.get('model_type', gan_type)
                wrapper_image_size = data_wrapper.get('image_size', image_size)
                wrapper_channels = data_wrapper.get('channels', channels)
                
                print(f"DATASET INFO:")
                print(f"  Samples: {len(dataset_obj)}")
                print(f"  Model Type: {wrapper_model_type}")
                print(f"  Image Size: {wrapper_image_size}")
                print(f"  Channels: {wrapper_channels}")
                
                if wrapper_model_type != gan_type:
                    print(f"  Model type mismatch: Config={gan_type}, Wrapper={wrapper_model_type}")
                    gan_type = wrapper_model_type
                
                image_size = wrapper_image_size
                channels = wrapper_channels
                
                dataset = GANDataset(
                    data_list=dataset_obj,
                    model_type=gan_type,
                    target_size=image_size,
                    channels=channels
                )
                    
            elif isinstance(data_wrapper, Dataset):
                dataset = data_wrapper
                print(f"PyTorch Dataset loaded with {len(dataset)} samples")
            else:
                print(f"Unexpected data format: {type(data_wrapper)}, creating default dataset")
                dataset = GANDataset(
                    data_list=[],
                    model_type=gan_type,
                    target_size=image_size,
                    channels=channels
                )
                
        except Exception as e:
            print(f"Error loading data: {e}")
            print("Creating dummy dataset for testing")
            dummy_data = [{'image_data': base64.b64encode(np.random.rand(64, 64).tobytes()).decode('utf-8')} 
                         for _ in range(100)]
            dataset = GANDataset(
                data_list=dummy_data,
                model_type=gan_type,
                target_size=image_size,
                channels=channels
            )
        
        # Create DataLoader with proper collate function
        def create_collate_fn(gan_type, image_size, channels):
            def collate_fn(batch):
                images = []
                for item in batch:
                    if isinstance(item, torch.Tensor):
                        images.append(item)
                    elif isinstance(item, tuple):
                        images.append(item[0])
                    else:
                        images.append(torch.tensor(item))
                
                if len(images) == 0:
                    return torch.tensor([])
                
                images = torch.stack(images)
                
                if gan_type in ['vanilla_gan', 'vanilla']:
                    if len(images.shape) == 4:
                        images = images.view(images.size(0), -1)
                    elif len(images.shape) == 3:
                        images = images.view(images.size(0), -1)
                else:
                    if len(images.shape) == 2:
                        batch_size_dim = images.shape[0]
                        images = images.view(batch_size_dim, channels, image_size, image_size)
                    elif len(images.shape) == 3:
                        batch_size_dim = images.shape[0]
                        images = images.unsqueeze(1)
                
                return images
            
            return collate_fn
        
        collate_fn = create_collate_fn(gan_type, image_size, channels)
        dataloader = DataLoader(
            dataset,
            batch_size=batch_size,
            shuffle=True,
            collate_fn=collate_fn,
            num_workers=0
        )
        
        # Test one batch
        try:
            test_batch = next(iter(dataloader))
            print(f"TEST BATCH SHAPE: {test_batch.shape}")
            print(f"DATALOADER INFO:")
            print(f"  Total Batches: {len(dataloader)}")
            print(f"  Batch Size: {batch_size}")
            print(f"  Total Samples: {len(dataset)}")
        except Exception as e:
            print(f"Error testing batch: {e}")
            if gan_type == 'dcgan':
                test_batch = torch.randn(batch_size, channels, image_size, image_size)
            else:
                test_batch = torch.randn(batch_size, image_size * image_size * channels)
            print(f"Created dummy batch with shape: {test_batch.shape}")
        
        # =============================================================================
        # LOAD GAN MODULES FROM NESY_FACTORY
        # =============================================================================
        
        print("\\n[2/4] LOADING GAN MODULES FROM NESY_FACTORY")
        print("-"*50)
        
        DCGAN = None
        DCGANConfig = None
        VanillaGAN = None
        VanillaGANConfig = None
        
        # Load DCGAN module
        try:
            dcgan_path = "/usr/local/lib/python3.10/site-packages/nesy_factory/GANs/dcgan.py"
            with open(dcgan_path, 'r') as f:
                dcgan_code = f.read()
            dcgan_namespace = {}
            exec(dcgan_code, dcgan_namespace)
            DCGAN = dcgan_namespace['DCGAN']
            DCGANConfig = dcgan_namespace['DCGANConfig']
            print(f"DCGAN loaded successfully from {dcgan_path}")
        except Exception as e:
            print(f"Failed to load DCGAN: {e}")
        
        # Load VanillaGAN module
        try:
            vanilla_path = "/usr/local/lib/python3.10/site-packages/nesy_factory/GANs/vanilla_gan.py"
            with open(vanilla_path, 'r') as f:
                vanilla_code = f.read()
            vanilla_namespace = {}
            exec(vanilla_code, vanilla_namespace)
            VanillaGAN = vanilla_namespace['VanillaGAN']
            VanillaGANConfig = vanilla_namespace['VanillaGANConfig']
            print(f"VanillaGAN loaded successfully from {vanilla_path}")
        except Exception as e:
            print(f"Failed to load VanillaGAN: {e}")
        
        # =============================================================================
        # LOAD AND RECONSTRUCT MODEL
        # =============================================================================
        
        print("\\n[3/4] LOADING INITIALIZED MODEL")
        print("-"*50)
        
        with open(args.initialized_model, 'rb') as f:
            model_data = pickle.load(f)
        
        print(f"Model data type: {type(model_data)}")
        
        device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')
        print(f"Using device: {device}")
        print(f"  CUDA Available: {torch.cuda.is_available()}")
        
        gan = None
        
        if isinstance(model_data, dict):
            print("Reconstructing from state dictionary")
            
            saved_model_type = model_data.get('model_type', gan_type)
            config_dict = model_data.get('config', {})
            
            print(f"  Model Type from saved data: {saved_model_type}")
            
            if saved_model_type == 'dcgan' and DCGAN is not None:
                print("Creating DCGAN configuration")
                config_dict['image_size'] = image_size
                config_dict['channels'] = channels
                config_dict['latent_dim'] = latent_dim
                config_dict['training_algorithm'] = algorithm
                
                # Use default layers if not specified
                if 'generator_layers' not in config_dict:
                    if image_size == 64:
                        config_dict['generator_layers'] = [512, 256, 128, 64, 32]
                        config_dict['discriminator_layers'] = [64, 128, 256]
                    elif image_size == 32:
                        config_dict['generator_layers'] = [256, 128, 64, 32]
                        config_dict['discriminator_layers'] = [64, 128]
                    else:
                        num_gen_layers = int(math.log2(image_size / 4))
                        config_dict['generator_layers'] = [512 // (2 ** i) for i in range(num_gen_layers)]
                        config_dict['discriminator_layers'] = [64 * (2 ** i) for i in range(num_gen_layers - 1)]
                
                print(f"  Architecture: Generator{config_dict.get('generator_layers', [])}")
                
                try:
                    config = DCGANConfig(**config_dict)
                except Exception as e:
                    print(f"  Config validation warning: {e}")
                    minimal_config = {
                        'image_size': image_size,
                        'channels': channels,
                        'latent_dim': latent_dim,
                        'generator_layers': config_dict.get('generator_layers', [512, 256, 128, 64]),
                        'discriminator_layers': config_dict.get('discriminator_layers', [64, 128, 256]),
                        'training_algorithm': algorithm,
                        'device': 'cpu'
                    }
                    config = DCGANConfig(**minimal_config)
                
                print("Instantiating DCGAN model")
                gan = DCGAN(config)
                
                if model_data.get('generator_state') is not None:
                    print("Loading generator state dict")
                    try:
                        gan.generator.load_state_dict(model_data['generator_state'])
                        print("  Generator loaded successfully")
                    except Exception as e:
                        print(f"  Warning: Could not load generator state: {e}")
                
                if model_data.get('discriminator_state') is not None:
                    print("Loading discriminator state dict")
                    try:
                        gan.discriminator.load_state_dict(model_data['discriminator_state'])
                        print("  Discriminator loaded successfully")
                    except Exception as e:
                        print(f"  Warning: Could not load discriminator state: {e}")
                    
            elif saved_model_type in ['vanilla_gan', 'vanilla'] and VanillaGAN is not None:
                print("Creating VanillaGAN configuration")
                input_dim = image_size * image_size * channels
                config_dict['input_dim'] = input_dim
                config_dict['latent_dim'] = latent_dim
                config_dict['training_algorithm'] = algorithm
                
                print(f"  Input dimension: {input_dim}")
                
                try:
                    config = VanillaGANConfig(**config_dict)
                except Exception as e:
                    print(f"  Config validation warning: {e}")
                    minimal_config = {
                        'input_dim': input_dim,
                        'latent_dim': latent_dim,
                        'generator_layers': config_dict.get('generator_layers', [256, 512, 1024]),
                        'discriminator_layers': config_dict.get('discriminator_layers', [1024, 512, 256]),
                        'training_algorithm': algorithm,
                        'device': 'cpu'
                    }
                    config = VanillaGANConfig(**minimal_config)
                
                print("Instantiating VanillaGAN model")
                gan = VanillaGAN(config)
                
                if model_data.get('generator_state') is not None:
                    print("Loading generator state dict")
                    try:
                        gan.generator.load_state_dict(model_data['generator_state'])
                        print("  Generator loaded successfully")
                    except Exception as e:
                        print(f"  Warning: Could not load generator state: {e}")
                
                if model_data.get('discriminator_state') is not None:
                    print("Loading discriminator state dict")
                    try:
                        gan.discriminator.load_state_dict(model_data['discriminator_state'])
                        print("  Discriminator loaded successfully")
                    except Exception as e:
                        print(f"  Warning: Could not load discriminator state: {e}")
            else:
                raise ValueError(f"Unknown model type: {saved_model_type}")
            
            print(f"Reconstructed {saved_model_type} from state dictionary")
        else:
            gan = model_data
            print(f"Direct model loaded: {type(gan).__name__}")
        
        if gan is None:
            raise ValueError("Failed to load GAN model")
        
        gan.generator.to(device)
        gan.discriminator.to(device)
        print("Generator and discriminator moved to device")
        
        # Test the model
        print("\\nMODEL TEST:")
        with torch.no_grad():
            if gan_type == 'dcgan':
                z = torch.randn(1, latent_dim, 1, 1, device=device)
                print(f"  Noise shape for DCGAN: {z.shape}")
            else:
                z = torch.randn(1, latent_dim, device=device)
                print(f"  Noise shape for VanillaGAN: {z.shape}")
            
            fake_img = gan.generator(z)
            print(f"  Generator output shape: {fake_img.shape}")
            
            # Expected shape
            if gan_type == 'dcgan':
                expected_shape = (1, channels, image_size, image_size)
            else:
                expected_shape = (1, channels * image_size * image_size)
            
            if fake_img.shape == expected_shape:
                print(f"   Generator output matches expected shape {expected_shape}")
            else:
                print(f"   Generator output mismatch. Expected {expected_shape}, got {fake_img.shape}")
        
        # =============================================================================
        # TRAINING LOOP
        # =============================================================================
        
        print("\\n[4/4] STARTING TRAINING")
        print("="*80)
        print(f"ALGORITHM: {algorithm.upper()}")
        print(f"GAN TYPE: {gan_type.upper()}")
        print(f"EPOCHS: {epochs}")
        print(f"BATCHES PER EPOCH: {len(dataloader)}")
        print("="*80)
        
        # Initialize training history
        training_history = {
            'epochs_completed': 0,
            'losses_g': [],
            'losses_d': [],
            'real_scores': [],
            'fake_scores': [],
            'algorithm': algorithm,
            'gan_type': gan_type,
            'timestamps': [],
            'epoch_times': [],
            'batch_details': []
        }
        
        # Initialize optimizers
        optimizer_g = torch.optim.Adam(gan.generator.parameters(), lr=learning_rate, betas=(0.5, 0.999))
        optimizer_d = torch.optim.Adam(gan.discriminator.parameters(), lr=learning_rate, betas=(0.5, 0.999))
        
        # Loss criterion
        criterion = nn.BCEWithLogitsLoss()
        
        # Training statistics
        total_batches = 0
        best_g_loss = float('inf')
        best_d_loss = float('inf')
        
        print("\\nALGORITHM-SPECIFIC PRE-TRAINING")
        print("-"*50)
        
        if algorithm in ['forward_forward', 'cafo']:
            print(f"Note: {algorithm.upper()} algorithm-specific training would be implemented here")
            print("Defaulting to standard GAN training for this implementation")
        
        print("\\n" + "="*80)
        print("MAIN TRAINING STARTING")
        print("="*80)
        print("Epoch | Batch | G Loss   | D Loss   | Real Score | Fake Score")
        print("-"*80)
        
        start_time = time.time()
        
        for epoch in range(epochs):
            epoch_start = time.time()
            epoch_g_losses = []
            epoch_d_losses = []
            epoch_real_scores = []
            epoch_fake_scores = []
            
            gan.generator.train()
            gan.discriminator.train()
            
            for batch_idx, real_data in enumerate(dataloader):
                batch_start = time.time()
                
                # Prepare real data
                real_data = real_data.to(device)
                batch_size_current = real_data.size(0)
                
                # Generate noise
                if gan_type == 'dcgan':
                    z = torch.randn(batch_size_current, latent_dim, 1, 1, device=device)
                else:
                    z = torch.randn(batch_size_current, latent_dim, device=device)
                
                # ============ Train Discriminator ============
                optimizer_d.zero_grad()
                
                # Real images
                real_output = gan.discriminator(real_data)
                real_labels = torch.ones_like(real_output, device=device)
                d_loss_real = criterion(real_output, real_labels)
                
                # Fake images
                fake_data = gan.generator(z)
                fake_output = gan.discriminator(fake_data.detach())
                fake_labels = torch.zeros_like(fake_output, device=device)
                d_loss_fake = criterion(fake_output, fake_labels)
                
                d_loss = (d_loss_real + d_loss_fake) / 2
                d_loss.backward()
                optimizer_d.step()
                
                # ============ Train Generator ============
                optimizer_g.zero_grad()
                
                # Generate new fake images
                fake_data = gan.generator(z)
                fake_output = gan.discriminator(fake_data)
                
                # Generator wants discriminator to think fake images are real
                g_labels = torch.ones_like(fake_output, device=device)
                g_loss = criterion(fake_output, g_labels)
                g_loss.backward()
                optimizer_g.step()
                
                # Calculate scores
                real_score = torch.sigmoid(real_output).mean().item()
                fake_score = torch.sigmoid(fake_output).mean().item()
                
                # Record metrics
                epoch_g_losses.append(g_loss.item())
                epoch_d_losses.append(d_loss.item())
                epoch_real_scores.append(real_score)
                epoch_fake_scores.append(fake_score)
                
                total_batches += 1
                
                # Record batch details
                training_history['batch_details'].append({
                    'epoch': epoch + 1,
                    'batch': batch_idx + 1,
                    'g_loss': float(g_loss.item()),
                    'd_loss': float(d_loss.item()),
                    'real_score': real_score,
                    'fake_score': fake_score,
                    'batch_time': time.time() - batch_start
                })
                
                # Print progress every 50 batches
                if (batch_idx + 1) % 50 == 0 or (batch_idx + 1) == len(dataloader):
                    print(f"{epoch+1:3d}/{epochs:<3d} | {batch_idx+1:3d}/{len(dataloader):<3d} | "
                          f"{g_loss.item():8.4f} | {d_loss.item():8.4f} | "
                          f"{real_score:10.4f} | {fake_score:10.4f}")
            
            # End of epoch processing
            epoch_time = time.time() - epoch_start
            avg_g_loss = np.mean(epoch_g_losses)
            avg_d_loss = np.mean(epoch_d_losses)
            avg_real_score = np.mean(epoch_real_scores)
            avg_fake_score = np.mean(epoch_fake_scores)
            
            # Update best losses
            if avg_g_loss < best_g_loss:
                best_g_loss = avg_g_loss
            if avg_d_loss < best_d_loss:
                best_d_loss = avg_d_loss
            
            # Store epoch metrics
            training_history['losses_g'].append(float(avg_g_loss))
            training_history['losses_d'].append(float(avg_d_loss))
            training_history['real_scores'].append(float(avg_real_score))
            training_history['fake_scores'].append(float(avg_fake_score))
            training_history['timestamps'].append(time.time())
            training_history['epoch_times'].append(epoch_time)
            training_history['epochs_completed'] = epoch + 1
            
            print("-"*80)
            print(f"EPOCH {epoch+1} SUMMARY:")
            print(f"  Avg G Loss: {avg_g_loss:.6f}")
            print(f"  Avg D Loss: {avg_d_loss:.6f}")
            print(f"  Avg Real Score: {avg_real_score:.4f}")
            print(f"  Avg Fake Score: {avg_fake_score:.4f}")
            print(f"  Epoch Time: {epoch_time:.2f}s")
            print(f"  Best G Loss: {best_g_loss:.6f}")
            print(f"  Best D Loss: {best_d_loss:.6f}")
            print("-"*80)
        
        # Training completed
        total_training_time = time.time() - start_time
        
        print("\\n" + "="*80)
        print("TRAINING COMPLETED - FINAL STATISTICS")
        print("="*80)
        print(f"Total Training Time: {total_training_time:.2f} seconds ({total_training_time/60:.2f} minutes)")
        print(f"Total Epochs: {epochs}")
        print(f"Total Batches: {total_batches}")
        print(f"Final G Loss: {training_history['losses_g'][-1]:.6f}")
        print(f"Final D Loss: {training_history['losses_d'][-1]:.6f}")
        print(f"Final Real Score: {training_history['real_scores'][-1]:.4f}")
        print(f"Final Fake Score: {training_history['fake_scores'][-1]:.4f}")
        
        # =============================================================================
        # GENERATE SAMPLES
        # =============================================================================
        
        print("\\n" + "="*80)
        print("GENERATING EVALUATION SAMPLES")
        print("="*80)
        
        generated_samples = []
        num_samples = min(16, training_config.get('num_samples', 16))
        print(f"Generating {num_samples} evaluation samples")
        
        gan.generator.eval()
        with torch.no_grad():
            for i in range(num_samples):
                if gan_type == 'dcgan':
                    z = torch.randn(1, latent_dim, 1, 1, device=device)
                else:
                    z = torch.randn(1, latent_dim, device=device)
                
                fake_img = gan.generator(z).cpu()
                
                # Convert to PIL Image
                if gan_type == 'dcgan':
                    # DCGAN output: (1, channels, height, width)
                    img_np = fake_img.squeeze(0).permute(1, 2, 0).numpy()
                    img_np = (img_np + 1) / 2 * 255  # Denormalize from [-1,1] to [0,255]
                    
                    if channels == 1:
                        img_np = img_np.squeeze()
                        img_pil = Image.fromarray(img_np.astype(np.uint8), mode='L')
                    else:
                        img_pil = Image.fromarray(img_np.astype(np.uint8), mode='RGB')
                else:
                    # VanillaGAN: might be flattened
                    if len(fake_img.shape) == 2:
                        flat_img = fake_img.squeeze(0)
                        side = int(math.sqrt(flat_img.shape[0] // channels))
                        if side * side * channels == flat_img.shape[0]:
                            img_np = flat_img.view(channels, side, side).permute(1, 2, 0).numpy()
                            img_np = (img_np + 1) / 2 * 255
                            if channels == 1:
                                img_pil = Image.fromarray(img_np.squeeze().astype(np.uint8), mode='L')
                            else:
                                img_pil = Image.fromarray(img_np.astype(np.uint8), mode='RGB')
                        else:
                            # Can't reshape properly, create placeholder
                            img_pil = Image.new('L', (64, 64), 128)
                    else:
                        # Already in image format
                        img_np = fake_img.squeeze(0).permute(1, 2, 0).numpy()
                        img_np = (img_np + 1) / 2 * 255
                        if channels == 1:
                            img_pil = Image.fromarray(img_np.squeeze().astype(np.uint8), mode='L')
                        else:
                            img_pil = Image.fromarray(img_np.astype(np.uint8), mode='RGB')
                
                # Convert to base64
                img_buffer = io.BytesIO()
                img_pil.save(img_buffer, format='PNG')
                img_base64 = base64.b64encode(img_buffer.getvalue()).decode('utf-8')
                
                generated_samples.append({
                    'sample_id': i,
                    'image_data': img_base64,
                    'model_type': gan_type,
                    'algorithm': algorithm,
                    'epoch': epochs,
                    'shape': list(fake_img.shape)
                })
        
        gan.generator.train()
        print(f"Generated {len(generated_samples)} samples")
        
        # =============================================================================
        # PREPARE TRAINING METRICS
        # =============================================================================
        
        training_metrics = {
            'model_type': gan_type,
            'training_algorithm': algorithm,
            'epochs_completed': epochs,
            'final_generator_loss': float(training_history['losses_g'][-1]),
            'final_discriminator_loss': float(training_history['losses_d'][-1]),
            'best_generator_loss': float(best_g_loss),
            'best_discriminator_loss': float(best_d_loss),
            'avg_generator_loss': float(np.mean(training_history['losses_g'])),
            'avg_discriminator_loss': float(np.mean(training_history['losses_d'])),
            'final_real_score': float(training_history['real_scores'][-1]),
            'final_fake_score': float(training_history['fake_scores'][-1]),
            'training_time': float(total_training_time),
            'samples_generated': len(generated_samples),
            'training_success': True,
            'performance': {
                'avg_epoch_time': np.mean(training_history['epoch_times']) if training_history['epoch_times'] else 0,
                'total_batches_processed': total_batches,
                'avg_batch_time': total_training_time / total_batches if total_batches > 0 else 0,
                'throughput': len(dataset) * epochs / total_training_time if total_training_time > 0 else 0
            }
        }
        
        print("\\n" + "="*80)
        print("TRAINING METRICS SUMMARY")
        print("="*80)
        for key, value in training_metrics.items():
            if key != 'performance':
                if isinstance(value, float):
                    print(f"{key}: {value:.6f}")
                else:
                    print(f"{key}: {value}")
        
        # =============================================================================
        # SAVE OUTPUTS
        # =============================================================================
        
        print("\\n" + "="*80)
        print("SAVING OUTPUTS")
        print("="*80)
        
        # Ensure output directories exist
        os.makedirs(os.path.dirname(args.trained_model), exist_ok=True)
        os.makedirs(os.path.dirname(args.training_history), exist_ok=True)
        os.makedirs(os.path.dirname(args.training_metrics), exist_ok=True)
        os.makedirs(os.path.dirname(args.generated_samples), exist_ok=True)
        
        # Save trained model
        print("Saving trained model...")
        model_dict = {
            'model_type': gan_type,
            'algorithm': algorithm,
            'generator_state': gan.generator.state_dict(),
            'discriminator_state': gan.discriminator.state_dict(),
            'config': {
                'latent_dim': latent_dim,
                'image_size': image_size,
                'channels': channels,
                'training_algorithm': algorithm,
                'generator_layers': config_dict.get('generator_layers', []),
                'discriminator_layers': config_dict.get('discriminator_layers', [])
            }
        }
        with open(args.trained_model, 'wb') as f:
            pickle.dump(model_dict, f)
        print(f" Model saved to: {args.trained_model}")
        
        # Save training history
        print("Saving training history...")
        with open(args.training_history, 'w') as f:
            json.dump(training_history, f, indent=2)
        print(f" Training history saved to: {args.training_history}")
        
        # Save training metrics
        print("Saving training metrics...")
        with open(args.training_metrics, 'w') as f:
            json.dump(training_metrics, f, indent=2)
        print(f" Training metrics saved to: {args.training_metrics}")
        
        # Save generated samples
        print("Saving generated samples...")
        with open(args.generated_samples, 'wb') as f:
            pickle.dump(generated_samples, f)
        print(f" Generated samples saved to: {args.generated_samples}")
        
        print("\\n" + "="*80)
        print("GAN TRAINING COMPLETED SUCCESSFULLY!")
        print("="*80)
        print(f"Algorithm: {algorithm}")
        print(f"Model Type: {gan_type}")
        print(f"Epochs Completed: {epochs}")
        print(f"Final G Loss: {training_metrics['final_generator_loss']:.6f}")
        print(f"Final D Loss: {training_metrics['final_discriminator_loss']:.6f}")
        print(f"Training Time: {total_training_time:.2f}s ({total_training_time/60:.2f} min)")
        print(f"Samples Generated: {len(generated_samples)}")
        print("\\nALL OUTPUTS SAVED SUCCESSFULLY:")
        print(f"Trained Model: {args.trained_model}")
        print(f"Training History: {args.training_history}")
        print(f"Training Metrics: {args.training_metrics}")
        print(f"Generated Samples: {args.generated_samples}")
        print("\\nEND OF TRAINING")

