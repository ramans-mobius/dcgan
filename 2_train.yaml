name: Train
description: Trains GAN model using master config with support for Backprop, Forward-Forward, and CAFO algorithms
inputs:
  - name: initialized_model
    type: Model
    description: Built GAN model from Build brick
  - name: preprocessed_data
    type: Dataset
    description: Preprocessed dataset from Preprocess brick
  - name: gan_config_json
    type: String
    description: Master GAN configuration as JSON string
outputs:
  - name: trained_model
    type: Model
  - name: training_history
    type: String
  - name: training_metrics
    type: String
  - name: generated_samples
    type: Dataset

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v35
    command:
      - sh
      - -c
      - |
        pip install torchvision==0.15.2 --quiet
        echo "Torchvision installed"
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import sys
        import json
        import pickle
        import base64
        import time
        import torch
        import torch.nn as nn
        from torch.utils.data import Dataset, DataLoader
        import numpy as np
        from PIL import Image
        import io
        
        # =============================================================================
        # IMPORT GAN MODULES
        # =============================================================================
        
        print("╔════════════════════════════════════════════════════════════════════════════╗")
        print("║                         GAN TRAINING COMPONENT                            ║")
        print("╚════════════════════════════════════════════════════════════════════════════╝")
        
        try:
            from nesy_factory.GANs.dcgan import DCGANConfig, DCGAN
            print("[INFO]  Successfully imported DCGAN module")
        except ImportError as e:
            print(f"[ERROR]  DCGAN import failed: {e}")
            sys.exit(1)
        
        try:
            from nesy_factory.GANs.vanilla_gan import VanillaGANConfig, VanillaGAN
            print("[INFO]  Successfully imported VanillaGAN module")
        except ImportError as e:
            print(f"[ERROR]  VanillaGAN import failed: {e}")
            sys.exit(1)
        
        # =============================================================================
        # MAIN TRAINING LOGIC
        # =============================================================================
        
        parser = argparse.ArgumentParser(description='GAN Training with Algorithm Support')
        parser.add_argument('--initialized_model', type=str, required=True)
        parser.add_argument('--preprocessed_data', type=str, required=True)
        parser.add_argument('--gan_config_json', type=str, required=True)
        parser.add_argument('--trained_model', type=str, required=True)
        parser.add_argument('--training_history', type=str, required=True)
        parser.add_argument('--training_metrics', type=str, required=True)
        parser.add_argument('--generated_samples', type=str, required=True)
        args = parser.parse_args()
        
        print("")
        print("╔════════════════════════════════════════════════════════════════════════════╗")
        print("║                       GAN TRAINING STARTING                               ║")
        print("╚════════════════════════════════════════════════════════════════════════════╝")
        
        print(f"[INFO] Command line arguments received:")
        print(f"  • initialized_model: {args.initialized_model}")
        print(f"  • preprocessed_data: {args.preprocessed_data}")
        print(f"  • gan_config_json: {len(args.gan_config_json)} characters")
        print(f"  • trained_model: {args.trained_model}")
        print(f"  • training_history: {args.training_history}")
        print(f"  • training_metrics: {args.training_metrics}")
        print(f"  • generated_samples: {args.generated_samples}")
        
        # =============================================================================
        # PARSE CONFIGURATION
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 1: Parsing GAN Configuration                                         │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        gan_config = json.loads(args.gan_config_json)
        model_config = gan_config['model']
        training_config = gan_config['training']
        
        algorithm = model_config['training_algorithm']
        gan_type = model_config['gan_type']
        
        print(f"[CONFIG] Model Type: {gan_type.upper()}")
        print(f"[CONFIG] Training Algorithm: {algorithm.upper()}")
        print(f"[CONFIG] Latent Dimension: {model_config['latent_dim']}")
        print(f"[CONFIG] Epochs: {training_config['epochs']}")
        print(f"[CONFIG] Batch Size: {training_config['batch_size']}")
        
        # =============================================================================
        # LOAD PREPROCESSED DATA
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 2: Loading Preprocessed Dataset                                      │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        start_time = time.time()
        with open(args.preprocessed_data, 'rb') as f:
            data_wrapper = pickle.load(f)
        load_time = time.time() - start_time
        
        print(f"[DATA] Data loaded in {load_time:.2f} seconds")
        print(f"[DATA] Data wrapper type: {type(data_wrapper)}")
        
        if isinstance(data_wrapper, dict) and 'dataset' in data_wrapper:
            dataset = data_wrapper['dataset']
            wrapper_model_type = data_wrapper['model_type']
            image_size = data_wrapper['image_size']
            channels = data_wrapper['channels']
            input_dim = data_wrapper['input_dim']
            
            print(f"[DATA]  Dataset loaded successfully:")
            print(f"  • Samples: {len(dataset):,}")
            print(f"  • Model Type: {wrapper_model_type}")
            print(f"  • Image Size: {image_size}x{image_size}")
            print(f"  • Channels: {channels}")
            print(f"  • Input Dimension: {input_dim}")
            
            if gan_type != wrapper_model_type:
                print(f"[WARNING]  Config gan_type ({gan_type}) differs from wrapper model_type ({wrapper_model_type})")
                print(f"[WARNING]  Using wrapper model_type: {wrapper_model_type}")
                gan_type = wrapper_model_type
        else:
            print(f"[ERROR]  Invalid data format: {type(data_wrapper)}")
            raise ValueError(f"Invalid data format: {type(data_wrapper)}")
        
        # =============================================================================
        # CREATE DATALOADER
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 3: Creating DataLoader                                              │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        batch_size = training_config['batch_size']
        
        def collate_fn(batch):
            if isinstance(batch[0], torch.Tensor):
                images = torch.stack(batch)
                if gan_type in ['vanilla_gan', 'vanilla']:
                    images = images.view(images.size(0), -1)
                return images
            else:
                raise ValueError(f"Unsupported batch type: {type(batch[0])}")
        
        dataloader = DataLoader(
            dataset, 
            batch_size=batch_size, 
            shuffle=True,
            collate_fn=collate_fn,
            num_workers=0
        )
        
        print(f"[DATA]  DataLoader created:")
        print(f"  • Batch Size: {batch_size}")
        print(f"  • Total Batches: {len(dataloader):,}")
        print(f"  • Samples per Batch: ~{len(dataset) // len(dataloader)}")
        
        # =============================================================================
        # LOAD AND RECONSTRUCT MODEL
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 4: Loading and Reconstructing Model                                 │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        start_time = time.time()
        with open(args.initialized_model, 'rb') as f:
            loaded_data = pickle.load(f)
        load_time = time.time() - start_time
        
        print(f"[MODEL] Model loaded in {load_time:.2f} seconds")
        print(f"[MODEL] Loaded data type: {type(loaded_data)}")
        
        if isinstance(loaded_data, dict):
            print("[MODEL]  Reconstructing model from state dictionary...")
            model_type = loaded_data['model_type']
            config_dict = loaded_data['config']
            
            print(f"[MODEL] Model Type from state: {model_type}")
            print(f"[MODEL] Config keys: {list(config_dict.keys())}")
            
            if model_type == 'dcgan':
                print("[MODEL] Creating DCGAN configuration...")
                config = DCGANConfig(**config_dict)
                print("[MODEL] Instantiating DCGAN model...")
                gan = DCGAN(config)
                
                if loaded_data['generator_state'] is not None:
                    print("[MODEL] Loading generator state dict...")
                    gan.generator.load_state_dict(loaded_data['generator_state'])
                    print("[MODEL]  Generator state loaded")
                if loaded_data['discriminator_state'] is not None:
                    print("[MODEL] Loading discriminator state dict...")
                    gan.discriminator.load_state_dict(loaded_data['discriminator_state'])
                    print("[MODEL]  Discriminator state loaded")
                    
            elif model_type in ['vanilla_gan', 'vanilla']:
                print("[MODEL] Creating VanillaGAN configuration...")
                config = VanillaGANConfig(**config_dict)
                print("[MODEL] Instantiating VanillaGAN model...")
                gan = VanillaGAN(config)
                
                if loaded_data['generator_state'] is not None:
                    print("[MODEL] Loading generator state dict...")
                    gan.generator.load_state_dict(loaded_data['generator_state'])
                    print("[MODEL]  Generator state loaded")
                if loaded_data['discriminator_state'] is not None:
                    print("[MODEL] Loading discriminator state dict...")
                    gan.discriminator.load_state_dict(loaded_data['discriminator_state'])
                    print("[MODEL]  Discriminator state loaded")
            else:
                raise ValueError(f"[ERROR]  Unknown model type: {model_type}")
            
            print(f"[MODEL]  Successfully reconstructed {model_type} from state dictionary")
        else:
            gan = loaded_data
            print(f"[MODEL]  Direct model loaded: {type(gan).__name__}")
        
        # =============================================================================
        # SETUP DEVICE AND MODEL
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 5: Device Setup and Model Preparation                               │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')
        print(f"[DEVICE] Using device: {device}")
        print(f"[DEVICE] CUDA Available: {torch.cuda.is_available()}")
        if torch.cuda.is_available():
            print(f"[DEVICE] CUDA Device Count: {torch.cuda.device_count()}")
            print(f"[DEVICE] CUDA Device Name: {torch.cuda.get_device_name(0)}")
        
        if hasattr(gan, 'generator'):
            gan.generator.to(device)
            print("[MODEL]  Generator moved to device")
            
            # Print generator info
            print(f"[MODEL] Generator Parameters: {sum(p.numel() for p in gan.generator.parameters()):,}")
            print(f"[MODEL] Generator Layers: {len(list(gan.generator.modules()))}")
        
        if hasattr(gan, 'discriminator'):
            gan.discriminator.to(device)
            print("[MODEL]  Discriminator moved to device")
            
            # Print discriminator info
            print(f"[MODEL] Discriminator Parameters: {sum(p.numel() for p in gan.discriminator.parameters()):,}")
            print(f"[MODEL] Discriminator Layers: {len(list(gan.discriminator.modules()))}")
        
        if hasattr(gan, 'trainer'):
            print("[MODEL]  Trainer object available")
        else:
            print("[WARNING]  No trainer object found in model")
        
        # =============================================================================
        # ALGORITHM-SPECIFIC PRE-TRAINING
        # =============================================================================
        
        print("")
        print("╔════════════════════════════════════════════════════════════════════════════╗")
        print("║                     ALGORITHM: {:<15}                         ║".format(algorithm.upper()))
        print("╚════════════════════════════════════════════════════════════════════════════╝")
        
        training_history = {
            'epochs_completed': 0,
            'losses_g': [],
            'losses_d': [],
            'real_scores': [],
            'fake_scores': [],
            'algorithm': algorithm,
            'timestamps': [],
            'epoch_times': []
        }
        
        epochs = training_config['epochs']
        
        if algorithm == 'forward_forward':
            print("[ALGORITHM]  Starting Forward-Forward pre-training...")
            if hasattr(gan.trainer, 'train_forward_forward'):
                print("[ALGORITHM] Calling train_forward_forward()...")
                ff_start = time.time()
                ff_results = gan.trainer.train_forward_forward(dataloader, verbose=True)
                ff_time = time.time() - ff_start
                training_history['ff_pre_training'] = ff_results
                training_history['ff_time'] = ff_time
                print(f"[ALGORITHM]  Forward-Forward pre-training completed in {ff_time:.2f} seconds")
            else:
                print("[ERROR]  Model trainer doesn't have train_forward_forward method")
                raise AttributeError("Model doesn't support Forward-Forward")
        
        elif algorithm == 'cafo':
            print("[ALGORITHM]  Starting CAFO pre-training...")
            if hasattr(gan.trainer, 'train_cafo'):
                print("[ALGORITHM] Calling train_cafo()...")
                cafo_start = time.time()
                cafo_results = gan.trainer.train_cafo(dataloader, verbose=True)
                cafo_time = time.time() - cafo_start
                training_history['cafo_pre_training'] = cafo_results
                training_history['cafo_time'] = cafo_time
                print(f"[ALGORITHM]  CAFO pre-training completed in {cafo_time:.2f} seconds")
            else:
                print("[ERROR]  Model trainer doesn't have train_cafo method")
                raise AttributeError("Model doesn't support CAFO")
        
        elif algorithm == 'backprop':
            print("[ALGORITHM]  Starting standard Backprop training...")
        
        else:
            print(f"[ERROR]  Unknown algorithm: {algorithm}")
            raise ValueError(f"Unknown algorithm: {algorithm}")
        
        # =============================================================================
        # MAIN TRAINING LOOP
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 6: Main Training Loop                                              │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        print(f"[TRAINING] Starting {epochs} epochs of training...")
        print(f"[TRAINING] Total batches per epoch: {len(dataloader):,}")
        print(f"[TRAINING] Estimated total iterations: {epochs * len(dataloader):,}")
        
        print("")
        print("╔════════════════════════════════════════════════════════════════════════════╗")
        print("║                           TRAINING PROGRESS                               ║")
        print("╠═══════╦════════════╦════════════╦══════════╦══════════╦═══════════════════╣")
        print("║ Epoch ║ G Loss     ║ D Loss     ║ Real     ║ Fake     ║ Time (s)          ║")
        print("╠═══════╬════════════╬════════════╬══════════╬══════════╬═══════════════════╣")
        
        for epoch in range(epochs):
            epoch_start = time.time()
            
            if hasattr(gan.trainer, 'train_epoch'):
                print(f"[TRAINING] Epoch {epoch+1}/{epochs}: Starting training...")
                metrics = gan.trainer.train_epoch(dataloader)
                
                g_loss = metrics['g_loss']
                d_loss = metrics['d_loss']
                real_score = metrics['real_score']
                fake_score = metrics['fake_score']
                
                # Additional metrics if available
                if 'total_loss' in metrics:
                    print(f"[TRAINING] Total Loss: {metrics['total_loss']:.4f}")
                if 'accuracy' in metrics:
                    print(f"[TRAINING] Accuracy: {metrics['accuracy']:.2f}%")
            else:
                print(f"[ERROR]  Model trainer doesn't have train_epoch method")
                raise AttributeError("Model trainer doesn't have train_epoch method")
            
            epoch_time = time.time() - epoch_start
            
            training_history['losses_g'].append(float(g_loss))
            training_history['losses_d'].append(float(d_loss))
            training_history['real_scores'].append(float(real_score))
            training_history['fake_scores'].append(float(fake_score))
            training_history['timestamps'].append(time.time())
            training_history['epoch_times'].append(epoch_time)
            
            print(f"║ {epoch+1:3d}/{epochs:<3d} ║ {g_loss:10.4f} ║ {d_loss:10.4f} ║ {real_score:8.3f} ║ {fake_score:8.3f} ║ {epoch_time:10.2f} ║")
            
            # Additional logging every 5 epochs
            if (epoch + 1) % 5 == 0 or epoch == epochs - 1:
                avg_g_loss = np.mean(training_history['losses_g'][-5:])
                avg_d_loss = np.mean(training_history['losses_d'][-5:])
                print(f"[TRAINING] Last 5 epochs average - G: {avg_g_loss:.4f}, D: {avg_d_loss:.4f}")
        
        print("╚═══════╩════════════╩════════════╩══════════╩══════════╩═══════════════════╝")
        
        training_history['epochs_completed'] = epochs
        
        # Calculate training statistics
        total_training_time = sum(training_history['epoch_times'])
        avg_epoch_time = np.mean(training_history['epoch_times'])
        std_epoch_time = np.std(training_history['epoch_times'])
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ TRAINING STATISTICS                                                       │")
        print("├────────────────────────────────────────────────────────────────────────────┤")
        print(f"│ Total Training Time: {total_training_time:.2f} seconds ({total_training_time/60:.2f} minutes)  │")
        print(f"│ Average Epoch Time:  {avg_epoch_time:.2f} seconds                         │")
        print(f"│ Epoch Time Std Dev:  {std_epoch_time:.2f} seconds                         │")
        print(f"│ Final G Loss:        {training_history['losses_g'][-1]:.6f}                   │")
        print(f"│ Final D Loss:        {training_history['losses_d'][-1]:.6f}                   │")
        print(f"│ Final Real Score:    {training_history['real_scores'][-1]:.4f}                 │")
        print(f"│ Final Fake Score:    {training_history['fake_scores'][-1]:.4f}                 │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        # =============================================================================
        # GENERATE SAMPLES
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 7: Generating Evaluation Samples                                    │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        generated_samples = []
        num_samples = training_config.get('num_samples', 16)
        
        print(f"[SAMPLES] Generating {num_samples} evaluation samples...")
        
        with torch.no_grad():
            gan.generator.eval()  # Set generator to evaluation mode
            
            for i in range(num_samples):
                sample_start = time.time()
                latent_dim = model_config['latent_dim']
                
                if gan_type == 'dcgan':
                    z = torch.randn(1, latent_dim, 1, 1, device=device)
                else:
                    z = torch.randn(1, latent_dim, device=device)
                
                fake_img = gan.generator(z).cpu()
                
                # Convert to image
                if gan_type == 'dcgan':
                    if fake_img.shape[1] == 1:  # Grayscale
                        img_np = (fake_img.squeeze(0).squeeze(0).numpy() + 1) / 2 * 255
                        img_pil = Image.fromarray(img_np.astype(np.uint8), mode='L')
                    else:  # RGB
                        img_np = (fake_img.squeeze(0).permute(1, 2, 0).numpy() + 1) / 2 * 255
                        img_pil = Image.fromarray(img_np.astype(np.uint8), mode='RGB')
                else:  # VanillaGAN
                    img_flat = fake_img.view(-1, image_size, image_size)
                    img_np = (img_flat.squeeze(0).numpy() + 1) / 2 * 255
                    img_pil = Image.fromarray(img_np.astype(np.uint8), mode='L')
                
                # Convert to base64
                img_bytes = io.BytesIO()
                img_pil.save(img_bytes, format='PNG')
                base64_data = base64.b64encode(img_bytes.getvalue()).decode('utf-8')
                
                generated_samples.append({
                    'sample_id': i,
                    'image_data': base64_data,
                    'model_type': gan_type,
                    'algorithm': algorithm,
                    'epoch': epochs,
                    'filename': f'{gan_type}_{algorithm}_sample_{i}.png'
                })
                
                sample_time = time.time() - sample_start
                if (i + 1) % 5 == 0 or i == num_samples - 1:
                    print(f"[SAMPLES] Generated {i+1}/{num_samples} samples ({sample_time:.3f}s per sample)")
        
        gan.generator.train()  # Set back to training mode
        print(f"[SAMPLES]  Generated {len(generated_samples)} samples successfully")
        
        # =============================================================================
        # CALCULATE FINAL METRICS
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 8: Calculating Final Metrics                                        │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        training_metrics = {
            'model_type': gan_type,
            'training_algorithm': algorithm,
            'epochs_completed': epochs,
            'final_generator_loss': training_history['losses_g'][-1],
            'final_discriminator_loss': training_history['losses_d'][-1],
            'avg_generator_loss': np.mean(training_history['losses_g']),
            'avg_discriminator_loss': np.mean(training_history['losses_d']),
            'min_generator_loss': np.min(training_history['losses_g']),
            'min_discriminator_loss': np.min(training_history['losses_d']),
            'final_real_score': training_history['real_scores'][-1],
            'final_fake_score': training_history['fake_scores'][-1],
            'training_time': total_training_time,
            'samples_generated': len(generated_samples),
            'training_success': True,
            'algorithm_specific': {
                'used_pre_training': algorithm in ['forward_forward', 'cafo'],
                'pre_training_success': algorithm in training_history
            },
            'performance': {
                'avg_epoch_time': avg_epoch_time,
                'total_batches_processed': epochs * len(dataloader),
                'throughput': len(dataset) * epochs / total_training_time if total_training_time > 0 else 0
            }
        }
        
        print("[METRICS]  Training Metrics Summary:")
        print(f"  • Model Type: {training_metrics['model_type']}")
        print(f"  • Algorithm: {training_metrics['training_algorithm']}")
        print(f"  • Epochs Completed: {training_metrics['epochs_completed']}")
        print(f"  • Final G Loss: {training_metrics['final_generator_loss']:.6f}")
        print(f"  • Final D Loss: {training_metrics['final_discriminator_loss']:.6f}")
        print(f"  • Average G Loss: {training_metrics['avg_generator_loss']:.6f}")
        print(f"  • Average D Loss: {training_metrics['avg_discriminator_loss']:.6f}")
        print(f"  • Min G Loss: {training_metrics['min_generator_loss']:.6f}")
        print(f"  • Min D Loss: {training_metrics['min_discriminator_loss']:.6f}")
        print(f"  • Training Time: {training_metrics['training_time']:.2f}s")
        print(f"  • Samples Generated: {training_metrics['samples_generated']}")
        print(f"  • Throughput: {training_metrics['performance']['throughput']:.1f} samples/second")
        
        # =============================================================================
        # SAVE OUTPUTS
        # =============================================================================
        
        print("")
        print("┌────────────────────────────────────────────────────────────────────────────┐")
        print("│ STEP 9: Saving Outputs                                                   │")
        print("└────────────────────────────────────────────────────────────────────────────┘")
        
        print("[SAVE] Creating output directories...")
        os.makedirs(os.path.dirname(args.trained_model), exist_ok=True)
        os.makedirs(os.path.dirname(args.training_history), exist_ok=True)
        os.makedirs(os.path.dirname(args.training_metrics), exist_ok=True)
        os.makedirs(os.path.dirname(args.generated_samples), exist_ok=True)
        
        print("[SAVE] Saving trained model...")
        save_start = time.time()
        with open(args.trained_model, 'wb') as f:
            pickle.dump(gan, f)
        save_time = time.time() - save_start
        print(f"[SAVE]  Model saved to: {args.trained_model} ({save_time:.2f}s)")
        
        print("[SAVE] Saving training history...")
        with open(args.training_history, 'w') as f:
            json.dump(training_history, f, indent=2)
        print(f"[SAVE]  Training history saved to: {args.training_history}")
        
        print("[SAVE] Saving training metrics...")
        with open(args.training_metrics, 'w') as f:
            json.dump(training_metrics, f, indent=2)
        print(f"[SAVE]  Training metrics saved to: {args.training_metrics}")
        
        print("[SAVE] Saving generated samples...")
        with open(args.generated_samples, 'wb') as f:
            pickle.dump(generated_samples, f)
        print(f"[SAVE]  Generated samples saved to: {args.generated_samples}")
        
        # =============================================================================
        # FINAL SUMMARY
        # =============================================================================
        
        print("")
